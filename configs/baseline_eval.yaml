# baseline — clean Uni-Sign AR model, greedy decode, NO streaming machinery (no membership gate, no confidence-bound).
#
# `extends: dlm.yaml` so the ~15 shared scalars (seed, language, language_model, checkpoint.*, wandb.*, visual_padding,
# freeze_*, bio_* head shape, max_text_tokens, ...) live in 1 place and never drift. This file keeps only what makes it
# the baseline: AR decoder, the gate/CB turned off, and its own output dir. The inherited streaming blocks (oput / spd / 
# mode_ratios / jitter / augmentation) are inert on the eval-only AR path — same tolerated pattern as bio_pretrain.yaml.
extends: dlm.yaml

decoder: ar
# The floor is the PRIOR-ART recipe and must stay a full fine-tune of the released front end, whatever the arms do.
# Without this pin it inherits dlm.yaml's block, and one flag flip there would silently adapt the baseline too —
# then README's `pretrained_slt` re-root would point the arms at a checkpoint trained under a different rule.
lora:
    enabled: false
membership_gate:
    enabled: false # the clean floor is UNGATED (cf. ar.yaml, the GATED AR de-risk of §9.3)
confidence_bound:
    enabled: false # no Mode-2a CB term on the baseline
checkpoint:
    dir: checkpoints/baseline/${language} # output dir (best.json / any optional retrain)
    # EVAL loads ONLY released Uni-Sign pose-only SLT checkpoint — resolved PER LANGUAGE from data.yaml `pretrained_slt`
    # (utils.resolve_pretrained) — with NO fallback to a trained checkpoint dir (enforced in eval._build_eval_model), so
    # a concurrent/prior train-slt run can never make the baseline silently pick up trained/empty weights.
wandb:
    enabled: false
    name: baseline_${language}
validation:
    num_beams: 1
