# baseline — the clean translator (clean floor), greedy decode, NO streaming machinery (no membership gate, no segmentation
# branch). `extends: dlm.yaml` so the ~15 shared scalars (seed, language, language_model, checkpoint.*, wandb.*, the `bio:` head
# shape, max_text_tokens, block_size, spd, ...) live in 1 place and never drift. This file keeps only what makes it the
# baseline: its decoder and the gate turned off. There is one clean floor per decoder. Eval builds the decoder that the
# loaded file stamps (the released Uni-Sign file: AR); a DLM floor decodes with the inherited block_size and spd, as the
# DLM arm. The inherited oput block trains a DLM floor (baseline_train.yaml); mode_ratios / jitter are inert at eval.
extends: dlm.yaml

# ar or dlm. It picks the clean floor that train-slt trains (baseline_train.yaml extends this file. It writes to
# checkpoints/baseline_train_<decoder>/<lang>) and the data.yaml pretrained_slt entry that --method baseline reads.
# README B2a: set dlm to train the DLM floor, then set ar again.
decoder: ar
membership_gate:
    enabled: false # the clean floor is UNGATED (cf. ar.yaml, the GATED AR de-risk of §9.3)
wandb:
    enabled: false
    name: baseline_${language}
validation:
    num_beams: 1
