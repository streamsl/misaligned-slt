# baseline — the pretrimmed translator, greedy decode, NO streaming machinery (no membership gate, no segmentation
# branch). `extends: dlm.yaml` so the ~15 shared scalars (seed, language, language_model, checkpoint.*, wandb.*, the `bio:` head
# shape, max_text_tokens, block_size, spd, ...) live in 1 place and never drift. This file keeps only what makes it the
# baseline: its decoder and the gate turned off. There is one pretrimmed translator per decoder. Eval builds the decoder that
# the loaded file stamps (the released Uni-Sign file: AR); a pretrimmed DLM translator decodes with the inherited block_size and
# spd, as the DLM arm. The inherited oput block trains a pretrimmed DLM translator (baseline_train.yaml); mode_ratios / jitter
# are inert at eval.
extends: dlm.yaml

# ar or dlm. It picks the pretrimmed translator that train-slt trains (baseline_train.yaml extends this file. It writes to
# checkpoints/baseline_train_<decoder>/<lang>) and the data.yaml pretrained_slt entry that eval.py --text pretrimmed reads.
# README B2a: set dlm to train the pretrimmed DLM translator, then set ar again.
decoder: ar
membership_gate:
    enabled: false # the pretrimmed translator is UNGATED (cf. ar.yaml, the GATED AR de-risk of §9.3)
wandb:
    enabled: false
    name: baseline_${language}
validation:
    num_beams: 1
