# baseline — clean Uni-Sign AR model, greedy decode, NO streaming machinery (no membership gate, no segmentation branch).
# `extends: dlm.yaml` so the ~15 shared scalars (seed, language, language_model, checkpoint.*, wandb.*, bio_* head shape, 
# max_text_tokens, ...) live in 1 place and never drift. This file keeps only what makes it the baseline: AR decoder and 
# the gate turned off. The inherited streaming blocks (oput / spd / mode_ratios / jitter) are inert on the eval-only 
# AR path — same tolerated pattern as bio_pretrain.yaml.
extends: dlm.yaml

decoder: ar
membership_gate:
    enabled: false # the clean floor is UNGATED (cf. ar.yaml, the GATED AR de-risk of §9.3)
wandb:
    enabled: false
    name: baseline_${language}
validation:
    num_beams: 1
