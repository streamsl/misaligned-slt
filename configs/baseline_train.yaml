# Train the clean translator for YouTube-SL-25 languages without an in-domain released checkpoint.
# Recipe = Uni-Sign stage-3 pose-only SLT transfer (reference repo fine_tuning.py + train_stage3.sh), strict 
# warm-start from the released checkpoint (data.yaml pretrained_slt).
#
# "Pre-trimmed" TRAINING VIEW with zero new data plumbing: mode1-only ratios + near-zero jitter make every
# sampler window exactly the GT caption span + one terminator frame, deterministically (at 1e-9 scales mode1's
# jittered-retry acceptance never fires and the clean-clip fallback always wins; anchors are index-driven, so
# one epoch = exact coverage of every train caption). NB these spans are CAPTION-cut, not studio-trimmed:
# onset noise and back-to-back bleed remain in the training windows. The RQ1 curve is self-anchored at (0,0).
# Deliberate deviations from Uni-Sign: no 256-frame random subsampling (their memory heuristic; our encoder runs 
# native-rate and deployment never subsamples — introducing it would create a rate mismatch OUR system never sees), 
# and single-GPU batch sizing below.
#
# BEFORE training: run README B1 (MEASURE: tune-decode-s1 -> delta-enc -> buffer-cap) — the sampler clamps this 
# recipe's windows to inference.yaml buffer_cap_s, and a stale cap silently unsupervises the long-sentence tail of 
# THIS arm only (see the cap note below).
# After training: set data.yaml <lang>.pretrained_slt to checkpoints/baseline_train/<lang>/model.pt (README B2b). 
# NOT train-bio: pooled S1 is language-agnostic and deliberately warm-starts from RELEASED checkpoint, so re-rooting 
# it on 1 language's fine-tune would privilege that language inside language-agnostic pretraining (train/bio_pretrain.py). 
# S1 features == stage-2 init features still holds, because stage 2 takes its encoder FROM S1 checkpoint.
extends: baseline_eval.yaml

epochs: 50
learning_rate: 3.0e-4
backbone_lr: 3.0e-4     # Uni-Sign's transfer recipe trains everything at ONE rate; the arms keep the 0.3x default.
weight_decay: 1.0e-4
scheduler:
    type: cosine
max_grad_norm: 1.0
batch_size: 32
freeze_backbone: false  # Uni-Sign transfer recipe: everything trainable, pose encoder included.
lambda_bio: 0.0         # Uni-Sign SLT loss is a SINGLE label-smoothed CE — no BIO auxiliary. 0 SKIPS the
                        # BIO branch outright (no forward/backward, S1 init ignored, head frozen), not zero-weights it.

mode_ratios:
    source: null        # clean-span training view — NOT the measured deployment-error mix (that calibrates stage 2)
    fallback: {mode1: 1.0, mode2: 0.0, mode3: 0.0, mode4: 0.0}
jitter:
    source: null
    fallback_laplace: {head_loc_s: 0.0, head_scale_s: 1.0e-9, tail_loc_s: 0.0, tail_scale_s: 1.0e-9}
augmentation: null      # Uni-Sign's SLT fine-tune uses no pose augmentation
# Captions LONGER than inference.yaml buffer_cap_s get right-truncated by the window clip and relabel to mode2 
# (no translation target -> and with lambda_bio 0, NO loss at all: the sentence is silently unsupervised).
# Deliberate: deployment can never decode >buffer_cap at once either (FSM force-commit), and Uni-Sign's
# alternative — random 256-frame subsampling — would train at a frame rate the deployed system never produces.
# CONSEQUENCE: the baseline must be (re)trained under the SAME buffer_cap_s the arms train under — a stale
# smaller cap silently removes the longest sentences (the heaviest BLEU mass) from THIS arm's supervision only,
# turning the controlled comparison into a training-data asymmetry. The cap is sized (p99 + stride + delta/fps)
# so the unsupervised tail stays ~1% of sentences.

checkpoint:
    dir: checkpoints/baseline_train/${language}
    bio_head_init: null              # explicit: extends deep-merges, so dlm.yaml's S1 path would leak through a
                                     # partial checkpoint override (it did — caught by the 'loaded S1 BIO head init'
                                     # log line; lambda_bio: 0 also hard-skips it in code, belt and braces)
    monitor: val_translation_bleu4   # selection by dev BLEU
    mode: max

wandb:
    name: baseline_train_${language}
