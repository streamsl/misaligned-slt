# S1: pose-only segmentation pretraining on the input types of pretrain.inputs, BIO only (data/chunks.py).
# The shared base supplies BIO architecture (the `bio:` block; train-bio derives the attention band). S1 reads its window-sampler
# blocks (mode_ratios, mode2_subcase_weights, jitter) only when pretrain.inputs lists windows, and its augmentation block.
extends: dlm.yaml
checkpoint:
    dir: checkpoints/bio_s1/${corpus}
    from_pretrained: checkpoints/openasl_pose_only_slt.pth  # Released Uni-Sign pose weights initialize S1 pose encoder
    save_best: true
    monitor: val_video_f1  # the edge chunk F1 (the main segmentation score) on whole dev streams
    mode: max
    restore_best: true
    eval_every_epochs: 1
    dev_batch_size: 32
wandb:
    name: bio_s1_${corpus}

# The pretraining data: the language pool and its per-language shares. No subtitle text enters S1.
pretrain:
    # The same pool, weights, dev corpora and temperature as the external segmenter (moryossef26.yaml). null = the target language alone.
    # bobsl_auto: BOBSL's automatic SAT labels on its official train split (noisy, but 1,144 h of BSL), for segmentation only.
    languages: [ase, asf, bfi, bobsl_auto]
    # The corpora whose dev sets choose the checkpoint (val_video_f1, each corpus scored apart, then averaged); default: the pool.
    # bobsl_auto stays out: its labels are SAT's own errors, and its official val holds the 4 dev episodes of bobsl_manual.
    dev_languages: [ase, asf, bfi]
    # τ and the weights set each corpus's share of the hours of a pooled epoch (data.loader._pool_targets): share ∝ weight ·
    # hours^τ, τ=1 proportional, τ=0 equal (the larger corpora's slices rotate). Weights default to 1; bfi and bobsl_auto at 0.5
    # each give BSL one share, as ASL (ase) and Auslan (asf) have. The best-epoch floor (one full rotation) is computed and printed
    # at run time, and the checkpoint stamps each corpus's hours per epoch (pretrain_hours).
    weights: {bfi: 0.5, bobsl_auto: 0.5}
    temperature: 0.0
    # Chunk lengths: each epoch tiles every training record, from a random phase, with chunks of length U(δ + K·stride, C)
    # (data/chunks.py), all from inference.yaml: C is its buffer_cap_s, the context the stage-2 head and the FSM run at.
    # The checkpoint stamps C, and evaluation uses the stamped trained context.
    # Input types of the train set. Each tile of the epoch's tiling becomes one listed type, in equal shares, inside its own
    # record (so each language keeps its share). Dev chunks are always plain chunks. The checkpoint stamps the list (--resume 
    # refuses a change).
    #   chunks          the tile itself: a random-phase chunk.
    #   restart_chunks  a chunk of the same length law that starts δ before a gold terminator of its record (O or B frame after
    #                   a reliable unit), where the FSM starts its buffer after a correct commit. The frames up to and including
    #                   the terminator frame are UNK.
    #   windows         a stage-2 window (the mode_ratios, mode2_subcase_weights and jitter of dlm.yaml) for a reliable unit of 
    #                   its record, BIO only. Every frame whose receptive field reaches a window edge is UNK; train-bio computes 
    #                   that reach from the model's modules (ST-GCN and conv-stem kernels, bio.depth x the attention band).
    # Choices: [chunks] (chunk-only training, the data of the Moryossef segmenter), [windows, restart_chunks],
    # [chunks, windows, restart_chunks].
    inputs: [chunks, windows, restart_chunks]

epochs: 100
batch_size: 32
grad_accum_steps: 1    # Effective batch = batch_size * grad_accum_steps
learning_rate: 1.0e-3  # The BIO head (random init)
# S1's pose encoder starts from the released Uni-Sign weights and trains at backbone_lr, the tuned head rate 
# (a smaller encoder rate learned too slowly). Only S1 has this key: stage 2 trains every module at 1 rate.
backbone_lr: 1.0e-3
weight_decay: 1.0e-4
early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    warmup_epochs: 0
