# S1 — BIO pretrain on FROZEN Uni-Sign pose features (docs/membership_gate.md §1.4; train/bio_pretrain.py).
#
# WHY `extends: dlm.yaml` — deliberate and important. S1 trains the in-system RoPE BIO head on the EXACT
# window distribution the SLT model will couple it under: same `StreamingWindowDataset` + `WindowSampler`, so it
# must inherit that pipeline's keys — mode_ratios, jitter, mode2_subcase_weights, augmentation (incl. fps_aug),
# bio_class_weights, dice_loss_weight — and the BIO-head arch (bio_hidden_dim/depth/nhead/dropout/conv_stem).
# Inheriting guarantees S1↔SLT window-distribution AND head-shape parity BY CONSTRUCTION (else
# checkpoint.bio_head_init would fail to strict-load).
#
# WHAT is inherited-but-UNUSED here (the BIO-only trainer reads none of these; ignore them):
#   language_model, decoder, oput, confidence_bound, membership_gate, dcd, spd, block_size, diffusion_steps,
#   lambda_trans, max_text_tokens, validation, checkpoint.bio_head_init.
# The FROZEN pose encoder is loaded from the language's released Uni-Sign checkpoint, resolved PER LANGUAGE from
# data.yaml `languages[lang].pretrained_slt` (utils.resolve_pretrained) — the SAME warm-start the SLT model uses,
# so S1 features == S2 initial features.
extends: dlm.yaml

checkpoint:
    dir: checkpoints/bio_s1/${language}
    save_best: true
    # val_mode3_tiou_f1, NOT the val_phrase_tiou_f1 headline: the headline is a per-window macro over a mix whose
    # single-span windows are near-saturated by ANY signing detector under the symmetric run-decode, and within a
    # run the headline ANTI-correlates with 2 slices that carry boundary information. mode3 (>=2 complete spans ->
    # interior-B quality) is the one slice whose geometry matches whole-video deployment.
    monitor: val_mode3_tiou_f1
    mode: max
    restore_best: true
wandb:
    name: bio_s1_${language} # own run name (else inherits dlm's)

# S1 and stage 2 share the fixed coverage mix. Segmenter-error analysis supplies jitter and Mode-2 cut depths.
# The external Moryossef segmenter remains an independent measurement instrument.

# S1 is a small head (~5M trainable) on a frozen backbone — its own optimisation budget, not the SLT model's.
epochs: 50
batch_size: 8
learning_rate: 2.0e-4
weight_decay: 1.0e-4
freeze_backbone: true
# backbone_lr: 1.0e-4  # optional: encoder LR when freeze_backbone: false (default learning_rate×0.1)

# Whole-video chunked-inference RoPE window for the `--segmenter-arch s1` ABLATION only (analyze.py --stage
# segmenter-infer / eval.py --segmenter-eval), in SECONDS. MUST match the head's trained context, not exceed it
# (Moryossef's core lesson: train/inference context mismatch is his largest negative ablation): training windows
# are clamped to buffer_cap_s (sampler.py), so eval chunks at buffer_cap_s too. DATASET-GENERAL — the inference
# wrapper converts to frames at each stream's own fps. DEFAULTS to inference.yaml's buffer_cap_s when unset
# (the value the FSM also deploys under, so eval matches deploy). CAVEAT for multi-dataset work: buffer_cap_s
# is one scalar in the shared inference.yaml that tail-benefit rewrites per corpus. A head trains under
# whatever buffer_cap_s was set THEN; if we later overwrite inference.yaml for another corpus and eval
# this head, train/deploy context diverge (whole-system, not just eval). Keep one head ↔ one buffer_cap_s
# (per-dataset configs, or pin it here):
# PINNED, not defaulted — the hazard above already fired once. This head trained while buffer_cap_s was 16.27;
# tail-benefit then raised the cap to 17.94 (it now adds stride + δ), and because the default tracks the LIVE cap
# the head silently started chunking over 1.7s of context it never trained on. Measured cost: dev tIoU-F1@0.5 fold
# B 0.5014 -> 0.4763 under the same tuned decode. The trained context is a property of the CHECKPOINT, so it must
# not follow later re-measurements of a deployment quantity. Re-pin only when S1 is retrained under a new cap.
rope_eval_chunk_s: 16.27
