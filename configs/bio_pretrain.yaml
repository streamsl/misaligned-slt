# S1: pose-only segmentation pretraining. The shared base supplies the window sampler and BIO architecture.
extends: dlm.yaml
checkpoint:
    dir: checkpoints/bio_s1/${corpus}
    # Released pose weights for both pooled and target-only S1. A complete S1 model.pt initializes target fine-tuning.
    from_pretrained: checkpoints/openasl_pose_only_slt.pth
    save_best: true
    monitor: val_mode3_tiou_f1
    mode: max
    restore_best: true
wandb:
    name: bio_s1_${corpus}

# Main recipe: same pool and temperature as the external segmenter. No subtitle text enters S1.
# For the target-only/fine-tune conditions, set the pool to null and pass --language.
# The continued-training study keeps all 3 languages, then specializes this same S1 model on each target.
pretrain_languages: [ase, asf, bfi]
# τ=1.0  ase 84% / asf 9%  / bfi 8%     (proportional)
# τ=0.5  ase 62% / asf 20% / bfi 19%
# τ=0.3  ase 50% / asf 25% / bfi 24% 
# τ=0.0  ase 33% / asf 33% / bfi 33%    (uniform)
pretrain_temperature: 0.3

# Auto uses the maximum source-train sentence p99 + stride + 1 second.
# A numeric value fixes a common context for the transfer study; evaluation uses the stamped trained context.
pretrain_geometry:
    buffer_cap_s: auto
    min_span_frames: 1

epochs: 100
batch_size: 32
grad_accum_steps: 1    # Effective batch = batch_size * grad_accum_steps
learning_rate: 2.0e-4
weight_decay: 1.0e-4
early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    warmup_epochs: 2
# The pose encoder and BIO head both train; the encoder uses backbone_lr (default 0.3 × learning_rate).
freeze_backbone: false
# backbone_lr: 1.0e-4  # optional override of default 0.3×learning_rate
