# S1 — BIO pretrain on FROZEN Uni-Sign pose features (docs/membership_gate.md §1.4; train/bio_pretrain.py).
#
# WHY `extends: dlm.yaml` — deliberate and load-bearing. S1 trains the in-system RoPE BIO head on the EXACT
# window distribution the SLT model will couple it under: same `StreamingWindowDataset` + `WindowSampler`, so it
# must inherit that pipeline's keys — mode_ratios, jitter, mode2_subcase_weights, augmentation (incl. fps_aug),
# bio_class_weights, dice_loss_weight — and the BIO-head arch (bio_hidden_dim/depth/nhead/dropout/conv_stem).
# Inheriting guarantees S1↔SLT window-distribution AND head-shape parity BY CONSTRUCTION (else
# checkpoint.bio_head_init would fail to strict-load).
#
# WHAT is inherited-but-UNUSED here (the BIO-only trainer reads none of these; ignore them):
#   language_model, decoder, oput, confidence_bound, membership_gate, dcd, spd, block_size, diffusion_steps,
#   lambda_trans, max_text_tokens, validation, checkpoint.bio_head_init. `checkpoint.from_pretrained`
#   (inherited) IS used — it supplies the FROZEN pose encoder (released Uni-Sign checkpoint).
extends: dlm.yaml

checkpoint:
    dir: checkpoints/bio_s1/${language}
    save_best: true
    monitor: val_phrase_tiou_f1 # span quality (one-to-one tIoU-matched F1) — what the FSM/gate consume, not frame accuracy
    mode: max
    restore_best: true
wandb:
    name: bio_s1_${language} # own run name (else inherits dlm's)

# NO circularity: Analysis A is measured by the INDEPENDENT external segmenter (train-segmenter; moryossef26.yaml),
# NOT this head — so S1 inherits dlm.yaml's mode_ratios.source / jitter.source and trains on the same measured
# misalignment distribution the SLT model uses (S1↔SLT window-distribution parity). Because the measured errors
# come from a segmenter the FSM does not contain, there is no loop: S1 is not trained on its own errors. (On clean
# CSL the measurement is degenerate for ANY segmenter, so both S1 and SLT fall back to the designed mix — that is a
# corpus property, not a circularity.)

# S1 is a small head (~5M trainable) on a frozen backbone — its own optimisation budget, not the SLT model's.
epochs: 20
batch_size: 128
learning_rate: 1.0e-3
weight_decay: 1.0e-4

# Whole-video chunked-inference RoPE window for the `--segmenter-arch s1` ABLATION only (analyze.py --stage
# segmenter-infer / eval.py --segmenter-eval), in SECONDS. MUST match the head's trained context, not exceed it
# (Moryossef's core lesson: train/inference context mismatch is his largest negative ablation): training windows
# are clamped to buffer_cap_s (sampler.py), so eval chunks at buffer_cap_s too. DATASET-GENERAL — the inference
# wrapper converts to frames at each stream's own fps (30fps CSL→540, 25fps PHOENIX→450, per-video YouTube fps).
# DEFAULTS to inference.yaml's buffer_cap_s when unset (the value the FSM also deploys under, so eval matches deploy).
# CAVEAT for multi-dataset work: buffer_cap_s is one scalar in the shared inference.yaml that tail-benefit rewrites
# per corpus. A head trains under whatever buffer_cap_s was set THEN; if we later overwrite inference.yaml for another
# corpus and eval this head, train/deploy context diverge (whole-system, not just eval). Keep one head ↔ one
# buffer_cap_s (per-dataset configs, or pin it here):
# rope_eval_chunk_s: 18.0   # explicit override in SECONDS; unused by stage-1 training
