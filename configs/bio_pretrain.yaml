# S1 — multilingual segmentation pretraining for the Uni-Sign pose encoder and BIO head.
#
# WHY `extends: dlm.yaml` — deliberate and important. S1 trains the in-system RoPE BIO head on the EXACT
# window distribution the SLT model will couple it under: same `StreamingWindowDataset` + `WindowSampler`, so it
# must inherit that pipeline's keys — mode_ratios, jitter, mode2_subcase_weights, augmentation (incl. fps_aug),
# bio_class_weights, dice_loss_weight — and the BIO-head arch (bio_hidden_dim/depth/nhead/dropout/conv_stem).
# Inheriting guarantees S1↔SLT window-distribution AND head-shape parity BY CONSTRUCTION (else
# checkpoint.bio_head_init would fail to strict-load).
#
# WHAT is inherited-but-UNUSED here (the BIO-only trainer reads none of these; ignore them):
#   language_model, decoder, oput, confidence_bound, membership_gate, dcd, spd, block_size, diffusion_steps,
#   lambda_trans, max_text_tokens, validation, checkpoint.bio_head_init.
# The pose encoder warm-starts from the RELEASED Uni-Sign checkpoint and TRAINS (`freeze_backbone: false` below —
# the shipped recipe; a pooled run never reads the per-language `pretrained_slt`, which after the B2b re-root would
# privilege 1 language inside language-agnostic pretraining). Stage 2 loads encoder AND head from this checkpoint 
# via `bio_head_init`, which is what "S1 features == S2 initial features" means now.
extends: dlm.yaml

checkpoint:
    # ${corpus} = what this checkpoint is a function of: the pool key (multi_ase-asf-bfi) when
    # pretrain_languages is set, else the language. One template serves both recipes — no path
    # rewriting in code, and a pooled checkpoint can never be mistaken for a monolingual one.
    dir: checkpoints/bio_s1/${corpus}
    save_best: true
    # val_mode3_tiou_f1, NOT the val_phrase_tiou_f1 headline: the headline is a per-window macro over a mix whose
    # single-span windows are near-saturated by ANY signing detector under the symmetric run-decode, and within a
    # run the headline ANTI-correlates with 2 slices that carry boundary information. mode3 (>=2 complete spans ->
    # interior-B quality) is the one slice whose geometry matches whole-video deployment.
    monitor: val_mode3_tiou_f1
    mode: max
    restore_best: true
wandb:
    name: bio_s1_${corpus} # own run name (else inherits dlm's); pool key on a pooled run

# S1 and stage 2 share the fixed coverage mix AND the designed corruption (fallback jitter, uniform Mode-2 cuts):
# one window distribution across both stages. The measured-jitter variant (dlm.yaml jitter.source, independent
# Moryossef artifact) is an S2 ablation, not the main recipe.

# SEGMENTATION PRETRAINING. Sentence boundaries are marked by prosody (pauses, holds, movement dynamics) that is
# shared across signed languages, so the pose encoder AND the BIO head pretrain on a POOL of languages; translation
# is language-specific and stays monolingual in stage 2. Set `pretrain_languages: null` for the single-language
# recipe (the monolingual-vs-multilingual ablation).
#
# The pool is sampled TEMPERATURE-FLATTENED (p ∝ n^tau): corpora differ several-fold in size, and proportional
# pooling would make the largest the de-facto training set. tau 1.0 = proportional, 0.0 = uniform, 0.5 = the
# standard multilingual-NMT compromise. The realised per-language counts are logged and written into the run
# config — they are part of the experimental setup and belong in the paper.
#
# The BASELINE segmenter (configs/moryossef26.yaml) must use the SAME pool: if our segmenter sees 3 languages
# and theirs sees 1, the cascade comparison measures a data advantage rather than a method.

# Pooled S1 geometry is a PRETRAINING design value. It must not inherit δ, Λ, or buffer capacity from whichever
# target language was analyzed last. Stage 2 measures and uses its own target-language geometry.
pretrain_geometry:
    # Must COVER the pool's sentence durations, or the designed mode mix is unrealizable: a sentence longer than
    # this cap can never appear COMPLETE in pretraining (the sampler clamps every window to the cap), so it is
    # permanently mode-2 and the head never learns to close it — punished at whole-video eval as under-segmentation.
    # `auto` = max over the pool of TRAIN-split p99 sentence duration + stride_s + 1 s: the label-only rule the
    # deployed caps follow (analyze.py --stage buffer-cap --split train writes p99 + stride + δ/fps per language),
    # with the 1 s margin covering any δ up to fps frames — so every deployed cap fits this context by construction
    # and no B1 stage has to run before S1. buffer-cap refuses to write a cap above the checkpoint's stamped context.
    # A number here is an explicit design override. Re-derived automatically if the pool or the GT settings change.
    buffer_cap_s: auto
    min_span_frames: 1

pretrain_languages: [ase, asf, bfi]
# τ=1.0  ase 84% / asf 9%  / bfi 8%     (proportional)
# τ=0.5  ase 62% / asf 20% / bfi 19%
# τ=0.3  ase 50% / asf 25% / bfi 24%.   
# τ=0.0  ase 33% / asf 33% / bfi 33%    (uniform)
pretrain_temperature: 0.3

# Multilingual pretraining trains the ENCODER too — a frozen backbone would leave only the ~6.7M-parameter head to
# pretrain, which is not a learned representation, and the backbone would never adapt to misaligned input before
# stage 2. The encoder trains at backbone_lr (default learning_rate×0.3) so the released weights are adapted, not
# overwritten. `bio_head_init` carries this encoder into stage 2, preserving "S1 features == S2 initial features".
epochs: 50
batch_size: 32
# backbone_lr: 1.0e-4  # optional override of default 0.3×learning_rate
learning_rate: 2.0e-4
weight_decay: 1.0e-4
early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    warmup_epochs: 2
freeze_backbone: false
