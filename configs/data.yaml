seed: 42
active_languages: [asf]

# Each language entry defines a YouTube-SL-25 root, target language, warm start, and pose properties. pose.fps is a 
# FALLBACK only. Real pose fps is resolved per video as total_pose_frames/video_duration from <root>/video_meta.csv. 
# ase/asf/bfi use SignVerse-2M poses at UNIFORM 24 fps — `prepare_data.py` writes their video_meta.csv (duration = 
# frames/24, exact). The per-video-fps note below is the SELF-EXTRACTION route: your own poses are extracted at the 
# NATIVE rate varies per YouTube video. You can generate its labels once with `python -m poses <root> [--format SEL]` 
# (yt-dlp metadata fetch, no video download).
languages:
    # asf/bfi poses come from SignVerse-2M (HF SignerX/SignVerse-2M; DWPose extracted at a UNIFIED 24 fps) via
    # `python prepare_data.py --languages asf bfi` — it writes <root>/poses/*.npy (canonical normalized-[0,1] 
    # 133-kpt), <root>/subs/*.vtt (per-video captions bundled in the shards) and <root>/video_meta.csv (duration 
    # from frame_count/24, so per-video fps calibration recovers exactly 24.0). pose.fps stays the fallback only.
    # asf/bfi/ase all target ENGLISH → warm-start from Uni-Sign's OpenASL release (openasl_pose_only_slt.pth): its
    # mT5 is tuned to emit English (OpenASL is ASL→English SLT) and its pose encoder saw sign skeletons — the right
    # init on both axes. OpenASL uses the same architecture and strict-loads.
    ase:
        name: ASL
        target_lang: en_XX
        pretrained_slt: checkpoints/openasl_pose_only_slt.pth
        # After the README B2 baseline fine-tune, re-root the language on the LOCAL clean-floor baseline so the
        # stage-2 arms, every later --method baseline eval, and a monolingual S1 share one init (§1.4 +
        # controlled comparison). The B1 MEASURE stages are indifferent: delta-enc strict-loads the S1
        # checkpoint over the warm start, and buffer-cap builds no model at all.
        # pretrained_slt: checkpoints/baseline_train/ase/model.pt
        root: data/youtube-sl-25/ase
        pose:
            fps: 24.0
            width: 1920
            height: 1080
    asf:
        name: Auslan (SignVerse-2M poses)
        target_lang: en_XX
        pretrained_slt: checkpoints/openasl_pose_only_slt.pth
        # After the README B2 baseline fine-tune, re-root the language on the LOCAL clean-floor baseline so the
        # stage-2 arms, every later --method baseline eval, and a monolingual S1 share one init (§1.4 +
        # controlled comparison). The B1 MEASURE stages are indifferent: delta-enc strict-loads the S1
        # checkpoint over the warm start, and buffer-cap builds no model at all.
        # pretrained_slt: checkpoints/baseline_train/asf/model.pt
        root: data/youtube-sl-25/asf
        pose:
            fps: 24.0 # SignVerse unified extraction rate (dataset card; verified on real shard headers)
            width: 1920 # dominant frame size (spatial augs only); real per-video W/H in video_meta.csv
            height: 1080
    bfi:
        name: BSL (SignVerse-2M poses)
        target_lang: en_XX
        pretrained_slt: checkpoints/openasl_pose_only_slt.pth
        # After the README B2 baseline fine-tune, re-root the language on the LOCAL clean-floor baseline so the
        # stage-2 arms, every later --method baseline eval, and a monolingual S1 share one init (§1.4 +
        # controlled comparison). The B1 MEASURE stages are indifferent: delta-enc strict-loads the S1
        # checkpoint over the warm start, and buffer-cap builds no model at all.
        # pretrained_slt: checkpoints/baseline_train/bfi/model.pt
        root: data/youtube-sl-25/bfi
        pose:
            fps: 24.0
            width: 1920
            height: 1080

splits:
    signverse_csv: data/youtube-sl-25/SignVerse-2M-metadata_split.csv
    fallback_seed: 42
    fallback_train: 0.8
    fallback_dev: 0.1
    # test split is the remainder (1 - train - dev), computed by build_splits.

poses:
    # 1 rule for every split and language. Exclude when 2+ bodies are detected in more than configured frame 
    # share AND the extra slots' shoulder-normalized arm variation exceeds the motion threshold. Missing shape 
    # measurements use count rule alone. Low variation exempts many pictures of people. This is a detector-based 
    # filter: noise and changing detection slots can also raise the score. Sequential signers are allowed. No 
    # video or channel exceptions. Motion is in shoulder widths, not a fraction capped at 1.
    max_multi_person_ratio: 0.5 # 1.0 disables this rule
    min_extra_person_motion: 0.7
    # Exclude videos with too many frames where no body is detected. Detection failure does not prove that
    # signing is absent. This threshold is applied to train, dev and test.
    max_undetected_ratio: 0.35
    # Exclude when fewer than this share of grouped caption intervals fits inside the supplied pose timeline
    # (1s end tolerance). This doesn't infer the cause, clip offset, or caption source. 0.0 disables it.
    min_unit_coverage: 0.5
    
subtitles:
    # Caption resolution per video: pick the best usable .vtt in <root>/subs/ (suffix priority below). subs/ is
    # delivered COMPLETE at prep time by `prepare_data.py --stage subs` (curated SignVerse English, provenance in
    # video_meta.csv caption_source), so there is no load-time fallback dir — a video with no vtt is genuinely
    # caption-less and dropped. human_only_splits: on these splits, exclude videos whose caption_source is in
    # human_only_exclude_sources (default just `mt` = NLLB machine-translation) so BLEU scores against human refs.
    dedup:
        # Cross-split de-duplication (data.loader._duplicate_pairs). YouTube re-uploads put the same talk in train 
        # and dev/test under different video ids; an id-based split does not separate them. The TRAIN copy is removed, 
        # so the eval sets stay exactly as the split CSV defines them. Every constant below is part of the detector 
        # spec and should be reported alongside results: they change which videos are considered duplicates.
        enabled: true
        df_cap: 20        # a caption in more videos than this is series boilerplate, not evidence of shared content
        min_words: 4      # shorter captions are sign-vocabulary labels that match unrelated videos
        min_captions: 10  # below this the cover fraction is quantized to 1/n and unreliable
        cover: 0.5        # flag a pair sharing more than this fraction of the smaller video's identifying captions
    # SCROLLING caption tracks (YouTube's rolling two-line auto-captions: more than half the cues start before previous 
    # one ends). Every cue time on such a track is a DISPLAY event: a line leaves the screen when line 2 later arrives, 
    # so its end runs a median 1.9-2.6 s (p90 3.0-3.9 s) past the next cue's start — 5-10x delta_enc — and clamping the 
    # overlap would only move the next unit's start late by the same amount. Punctuation fixes the grouping of such cues, 
    # so the track is dropped whole rather than repaired: 0 asf, 4 ase, 1 bfi videos.
    drop_scrolling_tracks: true
    human_only_splits: [test]
    human_only_exclude_sources: [mt]
    preferred_suffixes:
        - .en-GB.vtt
        - .en-en-GB.vtt
        - .en-en.vtt
        - .en.vtt
    reject_suffixes:
        - .en-orig.vtt
        - .orig.vtt
    min_caption_chars: 2
    # WRONG-LANGUAGE videos: drop a video when more than this share of its ALPHABETIC caption characters is non-Latin. 
    # `.en` subtitle track is not a guarantee — ASE pool carries Japanese Sign Language and Chinese-teaching content 
    # whose captions are largely Japanese/Chinese, which are unusable as English translation targets. Judged per VIDEO, 
    # never per cue: an English sentence quoting a foreign term ("and <han> in Chinese!") is real data. Measured on ase, 
    # 2 populations separate cleanly — bilingual videos 0.39-0.48, English-with-quotes below 0.05 — so 0.15 sits in the 
    # empty band between them and drops ~30/10588 videos. Set to 1.0 to disable (required for non-Latin TARGET language).
    max_non_latin_ratio: 0.15
    # Group whole cues into timestamp-supported caption units. A unit may contain several linguistic sentences.
    # Group using original punctuation; render internal sentence-final periods as commas afterward.
    # This defines the BIO and translation target for every corpus, arm and evaluation split.
    merge_sentences: true
    # Reject VTT variants that flatten the whole transcript into one short cue
    # (common in *.en-en-GB.vtt sidecars) before selecting the subtitle file.
    reject_flattened_transcripts: true
    flattened_max_cues: 2
    flattened_min_chars: 500
    flattened_max_chars_per_second: 120.0
    # Drop only whole-cue stage directions such as "AUDIENCE: (APPLAUSE)" or
    # "(gentle piano music)"; keep real sentences that merely mention music/social URLs.
    drop_noise_captions: true
    min_duration_s: 0.20
