seed: 42
active_languages: [csl]

# Each language entry carries the dataset routing (source/root/target_lang) plus a `pose:` block holding the
# per-dataset POSE-EXTRACTION properties (everything that depends on how this dataset's keypoints were
# produced — fps, confidence quality, coordinate frame). The pose-encoder ARCHITECTURE is the Uni-Sign backbone
# (backbones/unisign.py); these `pose:` settings are data properties, so they live with the dataset.
#
# pose.fps is a FALLBACK only. Real pose fps is resolved per video as total_pose_frames / video_duration from
# <root>/video_meta.csv — generate once with `python -m poses <root> [--format SEL]` (yt-dlp metadata fetch,
# no video download: whole-second durations ~0.3% drift; width/height resolved through the --format selector).
# Poses are extracted at native/2 fps and NATIVE rate varies per YouTube video (measured on Auslan: 62% eff
# 12.5, 30% at 15.0, 10% at 12.0, 8% at 25). A constant 25 misplaced every timestamp ~2x (label-motion
# correlation 0.10 vs 0.26 corrected; ~44% of captions dropped); even a hand-set 12.5 leaves 37.7% of videos
# with >5% timestamp error (median 26s end-of-video drift).
languages:
    # Synthetic streaming corpora (built by e2e-slt-streaming/data_synth). All data_synth datasets share
    # ONE schema, so each is just another entry with `source: streams` + its own `root` + `target_lang`
    # (the only per-dataset knob — it sets the LM target/tokenizer language). Clean GT cue boundaries + exact-fps
    # poses → the proven-working alternative to the noisy YouTube data. To add CSL-Daily / How2Sign later,
    # drop another entry below (e.g. csl_daily: source streams, target_lang zh_CN, root data/csl_daily) and
    # re-run Analysis A. PHOENIX is GERMAN: target_lang MUST be de_DE so mBART tokenizes German
    # correctly; en_XX would tokenize German as near-<unk> and learn nothing.
    phoenix:
        name: PHOENIX-2014T (synthetic streams)
        source: streams # routes load_language_records -> data.synth_streams.load_stream_records
        target_lang: de_DE
        root: data/phoenix
        pose:
            fps: 25.0
            # width/height (the pixel frame) feed only the train-time spatial augmentations (affine/spatial_mask);
            # Uni-Sign normalization is bbox-relative and resolution-independent. Auto-read from manifest src_meta
            width: 210
            height: 260
    csl_pretrimmed:
        name: CSL-Daily (official pre-trimmed, Uni-Sign pkl release)
        # data.pretrimmed.load_pretrimmed_records — eval-only. One single-sentence record per clip, REAL context
        # frames around [start,end) included, so RQ1 runs on real continuous context (no synthetic seams).
        # `--rq 1 --language csl_pretrimmed --severity-grid-s 0.0 --method baseline` is the paper-comparable
        # clean point (Uni-Sign CSL-Daily test BLEU-4 = 25.61). Synthetic-extracted sentences are NOT comparable
        # to the paper (the stream builder filters sentences) — never present them as the literature baseline.
        source: pretrimmed
        target_lang: zh_CN
        root: data/csl_pretrimmed
        pose:
            fps: 30.0 # CSL-Daily videos are 30 fps (same RTMPose extraction the synthetic streams were rebuilt from)
            width: 512
            height: 512
    csl:
        name: CSL-Daily (synthetic streams)
        source: streams # data.synth_streams.load_stream_records (pre-trimmed CSL-Daily cues + gaps)
        target_lang: zh_CN # mT5 prompt language -> 'Chinese'; matches released csl_daily_pose_only_slt.pth
        root: data/csl
        pose:
            fps: 30.0 # manifest.target_fps — regenerated at full 30 fps from Uni-Sign's pose-rtmpose-192-clean
            # Uni-Sign normalization (conf>0.3 gate + bbox crop_scale) is internal and resolution-independent;
            # width/height feed only the train-time spatial augmentations (affine/spatial_mask).
            width: 512 # manifest src_meta
            height: 512
    asf:
        name: Auslan
        target_lang: en_XX
        root: data/youtube-sl-25/asf
        pose:
            fps: 25.0
    bfi:
        name: BSL
        target_lang: en_XX
        root: data/youtube-sl-25/bfi
        pose:
            fps: 25.0
    ase:
        name: ASL
        target_lang: en_XX
        root: data/youtube-sl-25/ase
        pose:
            fps: 25.0

splits:
    signverse_csv: data/SignVerse-2M-metadata_split.csv
    fallback_seed: 42
    fallback_train: 0.8
    fallback_dev: 0.1
    # test split is the remainder (1 - train - dev), computed by build_splits.

subtitles:
    preferred_suffixes:
        - .en-GB.vtt
        - .en-en-GB.vtt
        - .en-en.vtt
        - .en.vtt
    reject_suffixes:
        - .en-orig.vtt
        - .orig.vtt
    min_caption_chars: 2
    # Reject VTT variants that flatten the whole transcript into one short cue
    # (common in *.en-en-GB.vtt sidecars) before selecting the subtitle file.
    reject_flattened_transcripts: true
    flattened_max_cues: 2
    flattened_min_chars: 500
    flattened_max_chars_per_second: 120.0
    # Drop only whole-cue stage directions such as "AUDIENCE: (APPLAUSE)" or
    # "(gentle piano music)"; keep real sentences that merely mention music/social URLs.
    drop_noise_captions: true
    min_duration_s: 0.20
    max_duration_s: 60.0
