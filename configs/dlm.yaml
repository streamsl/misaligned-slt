seed: 42
language: asf # default YouTube-SL-25 language; --language overrides it.
# The pose encoder is always Uni-Sign; the LANGUAGE MODEL is selected here: google/mt5-base (Path A default, the
# released Uni-Sign weights load on top) | facebook/mbart-large-cc25 (the mT5-vs-mBART ablation; mBART starts from base).
language_model:
    name: google/mt5-base
checkpoint:
    dir: checkpoints/dlm/${language} # best model.pt + best.json saved here
    # S1 BIO-head init (train.py --stage train-bio): head AND pose encoder pre-trained together (encoder at backbone_lr)
    # under same window sampler. With it present, set membership_gate.warmup_epochs: 0 — gate couples to competent head 
    # from step 1 (docs/membership_gate.md §1.4). Missing file with gate ENABLED → hard FileNotFoundError (train/slt.py); 
    # warning + fresh head only with the gate off, or set bio_head_init: null AND membership_gate.warmup_epochs >= 2.
    # Multilingual SEGMENTATION pretraining (configs/bio_pretrain.yaml pretrain_languages) writes ONE
    # language-agnostic checkpoint under checkpoints/bio_s1/multi_<pool>/. Point here for the monolingual
    # S1 recipe: checkpoints/bio_s1/${language}/model.pt
    # `auto` resolves through utils.checkpoint_dir against configs/bio_pretrain.yaml, so a pooled S1 is found by
    # its pool key and this file never carries a stale copy of the pool name. An explicit path still wins.
    bio_head_init: auto
    # Weights to fine-tune from: the released Uni-Sign pose-only SLT checkpoint. Resolved PER LANGUAGE from data.yaml 
    # `languages[lang].pretrained_slt` (utils.resolve_pretrained), because the right warm-start depends on the target 
    # language. Uncomment `from_pretrained` below to force 1 checkpoint regardless of language (an ablation override):
    # from_pretrained: checkpoints/openasl_pose_only_slt.pth
    save_best: true # write on every new best dev value (not just end of training)
    monitor: val_joint_score # Dev-window F1 times translation BLEU: a joint selection surrogate, not DVC.
    mode: max
    restore_best: true
decoder: dlm
wandb:
    enabled: false
    project: misaligned-slt
    name: dlm_${language}
    mode: online # offline / disabled if no network or key
visual_padding: none # raw windows; the LM encoder masks padding via attention_mask (no boundary halos)
freeze_backbone: false # Freeze the Uni-Sign pose encoder during SLT training as an overfitting regularizer.
freeze_projection: false
lambda_bio: 2.5
lambda_trans: 1.0
oput:
    # DMax dFactory data_transform.sft_noise_transition samples sigma ~ U(0.3, 0.8).
    # [0,1] wastes steps on near-trivial (t->0) and near-degenerate (t->1) masking.
    t_low: 0.3
    t_high: 0.8
    # DMax train_llada2_bd_oput.py corrupts on-policy with argmax (the greedy token SPD commits
    # at temperature 0). false = argmax (faithful default); true = sampled-rollout ablation.
    sample_rollout: false
    # DMax computes the rollout under model.eval() + no_grad (train_llada2_bd_oput.py) so corruption is drawn dropout-free —
    # the distribution inference sees. true = faithful (1 extra no-grad decoder forward PLUS 1 full LM-encoder forward
    # per mode group on Mode 1/3 batches); false = reuse the dropout-noised L_mask logits (cheaper approximation).
    rollout_eval_mode: true
    # Optimization PARITY with the AR arm, which trains with Uni-Sign's label smoothing 0.2 (models/unisign.py ar_loss). 
    # Without it the DLM is the only arm with an unsmoothed CE.
    label_smoothing: 0.2
confidence_bound:
    # Right-truncated (Mode 2a) term. Full-evidence decode is a no-grad stop-grad self-target; the gate reads the block
    # decode's confidence; CE gradient flows via 1 cheap forward on decoded sequence with gated slots re-masked, not via 
    # the block decode. See models/streaming_slt.py + dlm_decoder.remasked_logits.
    enabled: true
    verified_full_evidence_gate: true # penalize only where full-evidence decode == reference
    # Weight each corrected slot by the BELIEF GAP (teacher confidence - student's probability on that token) instead
    # of treating every gated slot equally. Near-misses and slots the teacher is itself unsure of get a small push.
    belief_gap: true # false = the original hard-gate CE.
    tau_cb: 0.75
    lambda: 1.0
    # The verified gate rejects wrong full-evidence tokens, so the S1/baseline warm start needs no CB warmup.
    # cb_active_count can rise as teacher coverage grows or fall as errors lose confidence. It is not a quality metric.
    warmup_epochs: 0
    # The Mode-2a self-target runs 2 block decodes per batch (full-evidence + truncated) under the SAME
    # `tau_dec` and block KV cache as inference, so the self-target is what the deployed decode would emit.
membership_gate: # Exact first-complete-span membership from legal BIO paths. Live logits carry caption gradients.
    enabled: true
    eps: 1.0e-4 # finite floor for the log-membership bias
    # Gate warmup — hold the gate off for the first `warmup_epochs` so it never couples to an untrained head
    # (garbage conditioning, §1.2). Canonical flow: run `train.py --stage train-bio` FIRST → checkpoint.bio_head_init
    # loads a sharp head → set warmup_epochs: 0 (the coupling trains from step one, §1.4). There is no safe
    # default: the code default is 0, and train-slt REFUSES gate+warmup 0 without a bio_head_init — training
    # from a fresh head deliberately requires setting warmup_epochs >= 2 by hand.
    warmup_epochs: 0
mode_ratios:      # Fixed coverage schedule; jitter and Mode-2 cut depths come from the designed `jitter:` block below.
    source: null  # measured event-mix ABLATION only; set a path to run it. Main method = the fixed mix below.
    degenerate_mode1_threshold: 0.9
    fallback:     # Fixed coverage mix, shared by all datasets. A DESIGN choice, not a measured distribution: the
        # segmenter-error event mix gives mode1~3% (too little complete-sentence supervision), so the mix is set to
        # cover each behaviour. mode1+mode3 = 0.65 complete-sentence targets; the extra mode2 mass feeds the CB signal.
        mode1: 0.45
        mode2: 0.30
        mode3: 0.20
        mode4: 0.05
# Within Mode 2, each over-segmentation event yields one right-trunc + one left-trunc window, so right~=left dominate;
# both-truncated is rare and "falls out of the sampler naturally". Uniform 1/3 over-represents the no-translation-supervision
# "both" case and dilutes the linchpin Mode-2a signal.
mode2_subcase_weights:
    right: 0.45
    left: 0.45
    both: 0.10
# Mode-3 span count {k: weight}: how many complete sentences a mode-3 window spans (k>=2). Unset = always 2. FSM reaches k>=3 
# buffers (commit retires 1 sentence per >=hysteresis strides while buffer grows every stride), so a tail here trains that regime.
# mode3_span_counts: {2: 0.6, 3: 0.3, 4: 0.1}
# Pose augmentation — TRAIN windows only (the Mode-2a full-evidence view and dev are never augmented).
# SPATIAL ops (centroid rotation + affine/spatial_mask jitter) — schema + defaults in poses/augmentation.py.
# The `fps` sub-block is the TEMPORAL augmentation (Moryossef 2026: essential, 0.58→0.49 without; speed_aug forbidden):
# BIO labels are rebuilt from the resampled timestamps. apply_fps_aug only downsamples, so the range must dip below the
# source rate. YouTube-SL-25 poses are 24 fps, so this range gives downsampled and native-density views.
augmentation:
    enabled: true
    rotation: { deg: 15.0, prob: 0.5 }
    affine: { prob: 0.0, scale: [0.9, 1.1], shift: [-0.05, 0.05], degree: null, shear: null }
    spatial_mask: { prob: 0.0, size: [0.1, 0.2] }
    fps: { enabled: true, min_fps: 15.0, max_fps: 30.0 }
# BIO loss = Dice(1.5) + class-weighted cross-entropy. Dice is BINARY signing-vs-not, so it carries the O/I imbalance but 
# gives NO B-vs-I signal; with B at 0.8% of frames, unweighted CE collapsed the class outright. Inverse frequency is far 
# too hot on B and over-segments; `balanced` uses the inverse-sqrt compromise, MEASURED on the corpus being trained 
# (train.losses.resolve_bio_class_weights) instead of pinning 1 dataset's constants — B's share is set by that corpus's 
# sentence rate, so no fixed vector ports. The resolved 4-list is saved with the run; an explicit {O,B,I} dict overrides it.
bio_class_weights: balanced
dice_loss_weight: 1.5 # weight on the Dice term in the in-model BIO head's NLL+Dice loss (S1 inherits this)
# In-model BIO head architecture. S1 (train.py --stage train-bio, bio_pretrain.yaml `extends` THIS file) and
# SLT training and S1 BOTH read these keys and MUST build the identical shape, or checkpoint.bio_head_init fails to
# strict-load. Keep them here as the single source of truth; do not override in bio_pretrain.yaml.
#   conv_stem_layers: the standalone Moryossef segmenter keeps the full UNet; this UNet-less head reads
#   pose-token features directly, so a small Conv1d stem restores the local boundary inductive bias
#   (EXPERIMENTS.md findings 8/23) the commit gate's δ_enc stability and RQ2 tIoU depend on. 0 = ablation (§4.4).
bio_hidden_dim: 384
bio_depth: 4
bio_nhead: 8
bio_dropout: 0.1
bio_conv_stem_layers: 2
jitter:
    # MAIN RECIPE: designed corruption for BOTH stages. `source: null` draws boundary jitter from fallback_laplace
    # and Mode-2 cut depths uniformly from fallback_cut_range — the same distributions S1 pretrains under. Designed,
    # not measured, deliberately: (a) S1↔S2 parity — swapping the nuisance model between stages injects a shift
    # justified only by fidelity to a segmenter we do not deploy; (b) deployment windows are cut by OUR head under
    # legal BIO decoding and terminator−δ commit — a different error law from the analysis segmenter's whole-video 
    # argmax errors, so a measured Laplace is not "matched to deployment" either; (c) robustness training wants 
    # coverage: the designed scales sit deliberately above measured boundary offsets, and sensitivity is MEASURED by 
    # RQ1 sweep, not assumed from a proxy. Segmenter-error taxonomy stays in paper as evidence that real segmenters 
    # produce exactly these event types, inside the designed support. MEASURED ABLATION: point `source` at INDEPENDENT 
    # segmenter's artifact: outputs/a_jitter_moryossef_${language}_dev.json. Laplace is the right family either way: 
    # measured offsets are leptokurtic (Laplace beats Gaussian in held-out log-lik on both edges).
    source: null
    fallback_laplace:
        head_loc_s: 0.0
        head_scale_s: 0.6 # deliberately broader than measured head offsets (coverage, not point-matching)
        tail_loc_s: 0.0
        tail_scale_s: 0.8 # broader still: deployment tails also carry cap-forced commits and survival splits
    fallback_cut_range: [0.15, 0.85] # uniform relative Mode-2 cut, clipped off edges so mode2 stays distinct from mode1/4
mixed_precision: auto # bf16 on Ampere+ GPUs, fp16+GradScaler otherwise, fp32 on CPU
batch_size: 16
grad_accum_steps: 1   # Effective batch = batch_size * grad_accum_steps
num_workers:
    4 # DataLoader workers (throughput knob; parallel pose-load + window-sample + tokenize). Safe at any value:
    # exact per-epoch coverage comes from the INDEX-driven anchor (sampler.sample(index) -> anchors[index % N], and
    # DataLoader partitions indices across workers); WindowSampler.configure_worker only RESEEDS each worker's rng so
    # the per-window jitter/mode draws decorrelate. (configure_worker does NOT partition anchors — the index does.)
# Uni-Sign initialization is already converged — its own 3e-4 is for fine-tuning from its stage-2 PRETRAIN checkpoint, 
# and the closest analog to our setting (DMax adding OPUT to a converged model) uses 2e-6.
learning_rate: 1.0e-4
weight_decay: 1.0e-4
epochs: 50
eval_every_epochs: 1
early_stopping: # Opt-in TERMINATION only (best-checkpoint monitor lives in `checkpoint:`). Remove this block or set
    enabled: true # enabled: false to train the full `epochs`.
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    warmup_epochs: 0
max_grad_norm: 1.0
# Text canvas ceiling, sized to the data like buffer_cap_s. A caption unit can hold several sentences, so target length
# follows the unit distribution: longest unit that fits streaming buffer needs 281 mT5 tokens on ase, 177 on asf and 143 
# on bfi. The pool sets it, so one value covers every target. Block alignment is required (BD3LM attends bidirectionally 
# within a block, and `data.batch` refuses a canvas that would cap mid-block): 320 = 2^6 x 5 divides by every block size 
# worth running (4, 8, 16, 32, 64), so block-size dial below moves without a 2nd canvas. `train.slt.assert_targets_fit` 
# refuses to start below the measured need — the collator never truncates complete target, so the alternative is a crash 
# mid-epoch; when a new language or protocol moves the maximum, that guard reports the value to put here.
max_text_tokens: 320
# false = size the text canvas to the batch (block-aligned, 1 PAD column for the confidence-bound shift; EOS tail is 
# added by the target builder). Equivalent supervision at a fraction of canvas width; the supervised set is pinned against 
# the dLLM rule in tests/test_design_regressions.py. false is the DEPLOYED setting; true restores fixed full-width canvas 
# for an equivalence check (cb_active_count / cb_loss should match over 1st epoch).
pad_text_to_max_length: false
validation:
    max_translation_samples: 0 # 0 = score translation on ALL dev windows
# Block size: BD3LM's interpolation dial between autoregression (block 1: 1 slot/block — AR order, with at most 1 soft-state 
# revision pass/slot) and full diffusion (block = canvas). It bounds DLM arm's parallelism and is a TRAINING parameter — the 
# block-causal mask, OPUT corruption and canvas alignment all read it — so it is stamped in the checkpoint and eval refuses 
# a decoder built at another block. A forward costs the block's slots against a KV cache of the finished blocks, so per-pass 
# cost grows with the block; whether NUMBER of passes falls with it doesn't follow, because a block ends only when all of its 
# slots have committed and settled — that is a property of the trained model's confidence, not of the block. 16 keeps blocks 
# inside the range BD3LM reports (4-16) while quadrupling the slots a single forward can commit; DMax runs block 32 at every 
# published point. No pass-count or latency number belongs here: measure it on dev at the RQ1 clean point with eval.yaml
# rq1.batch_size 1 and read `mean_decoder_passes` beside `text_metrics` (AR arm's count in that field is its generate() length: 
# N cached steps + the confidence pass).
block_size: 16
spd: # Block decode (infer/decode.py, DMax decode_uniform) — design spec §7.2.
    # Commit threshold: a pass commits longest run of masked slots whose max-prob clears it (>= 1) and re-predicts every 
    # committed slot of the block. Block ends once no mask remains and every generated slot's max-prob is >= 0.9 (infer/decode.py 
    # SETTLE_CONFIDENCE, fixed, independent of tau_dec) or a pass changes nothing, with at most 1 revision-only pass per slot 
    # after last commit. tau_dec is the inference-time dial inside the block: lower commits more slots per forward and leans on 
    # SPD + OPUT self-revision to repair them; a value the model cannot reach commits one slot per forward. 1 value for Mode-2a 
    # self-target, dev decoding and inference (inference.yaml translation.tau_dec overrides at eval time; trained value is stamped).
    # Reachable range is shaped by `oput.label_smoothing`: under smoothing 0.2 the per-token loss MINIMISER sits at max-prob 0.8, 
    # so a threshold at or above it makes most slots wait and the decode approaches 1 commit per pass. 0.8 is not a ceiling, so the 
    # settle test at 0.9 does fire and how often is a property of the trained model. DMax's published points are 0.65 on code, 0.5 
    # on math, 0.3 on LLaDA2-mini (dInfer/evaluations/eval_llada_dmax_{code,math}.sh, eval_llada_mini.sh, all at block_length 32, 
    # all via decode_uniform) and 0.0 in chat.py. 0.5 is their math point and is reachable here; it is a starting value, not a 
    # selected one: run the RQ1 clean point (`--rq 1 --method dlm --severity-grid-s 0.0`, eval.yaml rq1.batch_size 1) at a few 
    # values and pick on dev BLEU against `mean_decoder_passes`; the AR arm's count in the same field is its generate() length.
    tau_dec: 0.5
    top_k: 1 # DMax SPD top-k token/mask embedding mixture.
    renormalize: true # DMax Eq. 10 norm restoration.
# NB: cross-stride inference caching is intentionally NOT implemented (forbidden by spec — the buffer is
# re-decoded from scratch each stride; see infer/stream.py). Inside one decode the final blocks are KV-cached.
