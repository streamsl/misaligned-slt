seed: 42
language: asf # default YouTube-SL-25 language; --language overrides it.
# The pose encoder is always Uni-Sign; the LANGUAGE MODEL is selected here: google/mt5-base (Path A default, the
# released Uni-Sign weights load on top) | facebook/mbart-large-cc25 (the mT5-vs-mBART ablation; mBART starts from base).
language_model:
    name: google/mt5-base
checkpoint:
    dir: checkpoints/dlm/${language} # best model.pt + best.json saved here
    # S1 BIO-head init (train.py --stage train-bio): head AND pose encoder pre-trained together (encoder at backbone_lr)
    # under same window sampler. With it present, set membership_gate.warmup_epochs: 0 — gate couples to competent head 
    # from step 1 (docs/membership_gate.md §1.4). Missing file with gate ENABLED → hard FileNotFoundError (train/slt.py); 
    # warning + fresh head only with the gate off, or set bio_head_init: null AND membership_gate.warmup_epochs >= 2.
    # Multilingual SEGMENTATION pretraining (configs/bio_pretrain.yaml pretrain_languages) writes ONE
    # language-agnostic checkpoint under checkpoints/bio_s1/multi_<pool>/. Point here for the monolingual
    # S1 recipe: checkpoints/bio_s1/${language}/model.pt
    # `auto` resolves through utils.checkpoint_dir against configs/bio_pretrain.yaml, so a pooled S1 is found by
    # its pool key and this file never carries a stale copy of the pool name. An explicit path still wins.
    bio_head_init: auto
    # Weights to fine-tune from: the released Uni-Sign pose-only SLT checkpoint. Resolved PER LANGUAGE from data.yaml 
    # `languages[lang].pretrained_slt` (utils.resolve_pretrained), because the right warm-start depends on the target 
    # language. Uncomment `from_pretrained` below to force 1 checkpoint regardless of language (an ablation override):
    # from_pretrained: checkpoints/openasl_pose_only_slt.pth
    save_best: true # write on every new best dev value (not just end of training)
    # Best-checkpoint SELECTION (separate from early stopping). Select on dev BLEU, not val_loss: the composite
    # val_loss (BIO + OPUT + CB) rises from translation-side overfitting on the small corpus while BLEU is still
    # climbing, so a min-val_loss monitor would restore an early, low-BLEU checkpoint (standard SLT also selects on
    # dev BLEU). Generation runs every eval anyway (validation.max_translation_samples: 0).
    monitor: val_translation_bleu4
    mode: max
    restore_best: true
decoder: dlm
wandb:
    enabled: false
    project: misaligned-slt
    name: dlm_${language}
    mode: online # offline / disabled if no network or key
visual_padding: none # raw windows; the LM encoder masks padding via attention_mask (no boundary halos)
freeze_backbone: false # Freeze the Uni-Sign pose encoder during SLT training as an overfitting regularizer.
freeze_projection: false
lambda_trans: 1.0
oput:
    # DMax dFactory data_transform.sft_noise_transition samples sigma ~ U(0.3, 0.8).
    # [0,1] wastes steps on near-trivial (t->0) and near-degenerate (t->1) masking.
    t_low: 0.3
    t_high: 0.8
    # DMax train_llada2_bd_oput.py corrupts on-policy with argmax (the greedy token SPD commits
    # at temperature 0). false = argmax (faithful default); true = sampled-rollout ablation.
    sample_rollout: false
    # DMax computes the rollout under model.eval() + no_grad (train_llada2_bd_oput.py) so corruption is drawn dropout-free —
    # the distribution inference sees. true = faithful (1 extra no-grad decoder forward PLUS 1 full LM-encoder forward
    # per mode group on Mode 1/3 batches); false = reuse the dropout-noised L_mask logits (cheaper approximation).
    rollout_eval_mode: true
    # Maximum EOS padding. The target stops at the next block boundary, as in dLLM's AppendEOSBlockWrapper.
    # This prevents an unsupervised canvas tail without adding one full EOS block to every short sentence.
    eos_supervision_tokens: 4
    # Optimization PARITY with the AR arm, which trains with Uni-Sign's label smoothing 0.2 (models/unisign.py ar_loss). 
    # Without it the DLM is the only arm with an unsmoothed CE.
    label_smoothing: 0.2
confidence_bound:
    # Right-truncated (Mode 2a) term. The full-evidence decode is a no-grad stop-grad self-target; the gate reads the real
    # SPD+DCD decode's confidence; the CE gradient flows through ONE cheap forward on the decoded sequence with the gated slots
    # re-masked (DCD deferral counterfactual), not ~64-step decode. See models/streaming_slt.py + dlm_decoder.remasked_logits.
    enabled: true
    verified_full_evidence_gate: true # penalize only where full-evidence decode == reference
    # Weight each corrected slot by the BELIEF GAP (teacher confidence - student's probability on that token) instead
    # of treating every gated slot equally. Near-misses and slots the teacher is itself unsure of get a small push.
    belief_gap: true # false = the original hard-gate CE.
    tau_cb: 0.75
    lambda: 1.0
    # The verified gate rejects wrong full-evidence tokens, so the S1/baseline warm start needs no CB warmup.
    # cb_active_count can rise as teacher coverage grows or fall as errors lose confidence. It is not a quality metric.
    warmup_epochs: 0
    # SPEED: the Mode-2a self-target runs TWO full SPD/DCD decodes per batch (full-evidence + truncated) — the
    # dominant DLM training cost. It is internal (it only picks 'confidently wrong' slots), so it decodes FAST and
    # need NOT match the inference decode: few settle steps + the (verified-exact) static-window prefix KV-cache.
    # The membership gate rides the cache too: Ω biases cross-attention SCORES (cached K/V are Ω-independent), so
    # the gated cached decode is numerically identical to the gated no-cache decode (CrossAttnOmegaInjector on the
    # native forward — the same KV-cache-safe mechanism the AR arm uses; test_block_diffusion asserts equality).
    # decode_steps bounds only the FINAL settle pass; the per-block settles (bounded by block_size) dominate the
    # settle cost, so lowering this trims little — `revision: false` is the knob that removes the settle phase.
    # Set cache_type: none + window_type: sliding to make CB decode exactly like inference at the cost of speed.
    decode_steps: 32
    cache_type: prefix
    window_type: static
membership_gate:
    # Condition the DLM decoder on the BIO head's segmentation belief (docs/membership_gate.md): an additive,
    # query-independent bias Ω(t) on cross-attention = γ·ln(m∨ε)+ln(1−χ+ε). This is the ONLY channel by which
    # the segmenter's knowledge reaches the decoder at decode time — without it the two heads are separate models
    # sharing an encoder (§1.1). Ω is built from DETACHED BIO logits: it conditions the decoder; no translation
    # gradient reaches the head (trained by alpha*(CE+Dice) + (1-alpha)*KL to frozen S1, see bio loss note below).
    # Applies to BOTH decoder arms: the DLM injects Ω in its manual decode; the AR de-risk arm injects the
    # SAME Ω via HF cross-attention forward-hooks (models.membership_gate.CrossAttnOmegaInjector), so §9.3 is a
    # gated-vs-gated decoder-family contrast. This block is inherited by ar.yaml (extends dlm).
    enabled: true
    # δ (ramp width / boundary tolerance / 2δ trust-band half-width) and Λ_min are NOT set here: they are
    # DERIVED at load from inference.yaml's per-language measured geometry (utils.resolve_inference →
    # train/slt._inject_gate_geometry). A per-language value mirrored into this shared file is a stale-constant
    # hazard — there is deliberately no key to drift.
    eps: 1.0e-4 # doubt cap: γ·ln ε ≈ −9.2·γ (a bias, not a mask — a strong content score still beats it).
    # IoU veto (teacher forcing of the mask, train only): when the head's own closed span neither covers the GT target within
    # delta nor overlaps it at tIoU >= iou_veto, Omega is rebuilt from the GT span; open spans keep a start within delta of GT.
    # A span that COVERS the target (a merge) is kept: the decoder sees every sentence inside it and the target text follows
    # (multi-sentence targets); a kept span that shows ANOTHER whole sentence is a miss and is teacher-forced. gate_veto_rate is
    # logged. 0 disables only the tIoU test: no-closed-span windows, shown-other-sentence spans and open starts beyond delta
    # are still forced (the veto has no off switch; the ablation is gt_anchored).
    iou_veto: 0.5
    gt_anchored: false # always-GT ablation row (§3). Leave false for the on-policy method.
    # Gate warmup — hold the gate off for the first `warmup_epochs` so it never couples to an untrained head
    # (garbage conditioning, §1.2). Canonical flow: run `train.py --stage train-bio` FIRST → checkpoint.bio_head_init
    # loads a sharp head → set warmup_epochs: 0 (the coupling trains from step one, §1.4). There is no safe
    # default: the code default is 0, and train-slt REFUSES gate+warmup 0 without a bio_head_init — training
    # from a fresh head deliberately requires setting warmup_epochs >= 2 by hand.
    warmup_epochs: 0
mode_ratios:      # Fixed coverage schedule; jitter and Mode-2 cut depths come from the designed `jitter:` block below.
    source: null  # measured event-mix ABLATION only; set a path to run it. Main method = the fixed mix below.
    degenerate_mode1_threshold: 0.9
    fallback:     # Fixed coverage mix, shared by all datasets. A DESIGN choice, not a measured distribution: the
        # segmenter-error event mix gives mode1~3% (too little complete-sentence supervision), so the mix is set to
        # cover each behaviour. mode1+mode3 = 0.65 complete-sentence targets; the extra mode2 mass feeds the CB signal.
        mode1: 0.45
        mode2: 0.30
        mode3: 0.20
        mode4: 0.05
# Within Mode 2, each over-segmentation event yields one right-trunc + one left-trunc window, so right~=left dominate;
# both-truncated is rare and "falls out of the sampler naturally". Uniform 1/3 over-represents the no-translation-supervision
# "both" case and dilutes the linchpin Mode-2a signal.
mode2_subcase_weights:
    right: 0.45
    left: 0.45
    both: 0.10
# Mode-3 span count {k: weight}: how many complete sentences a mode-3 window spans (k >= 2). Unset = always 2. The FSM reaches k>=3 
# buffers (a commit retires 1 sentence per >=hysteresis strides while the buffer grows every stride), so a tail here trains that regime.
# mode3_span_counts: {2: 0.6, 3: 0.3, 4: 0.1}
# Pose augmentation — TRAIN windows only (the Mode-2a full-evidence view and dev are never augmented).
# SPATIAL ops (centroid rotation + affine/spatial_mask jitter) — schema + defaults in poses/augmentation.py.
# The `fps` sub-block is the TEMPORAL augmentation (Moryossef 2026: essential, 0.58→0.49 without; speed_aug forbidden):
# BIO labels are rebuilt from the resampled timestamps. apply_fps_aug only downsamples, so the range must dip below the
# source rate. YouTube-SL-25 poses are 24 fps, so this range gives downsampled and native-density views.
augmentation:
    enabled: true
    rotation: { deg: 15.0, prob: 0.5 }
    affine: { prob: 0.0, scale: [0.9, 1.1], shift: [-0.05, 0.05], degree: null, shear: null }
    spatial_mask: { prob: 0.0, size: [0.1, 0.2] }
    fps: { enabled: true, min_fps: 15.0, max_fps: 30.0 }
# Stage 2 with an S1 init trains the head by standard distillation (train.losses.bio_distill_loss)
bio_distill:    #   L_BIO = alpha * (CE + Dice on GT) + (1 - alpha) * T^2 * KL(S1 || head)
    alpha: 0.2  # alpha keeps a small GT path (the monolingual GT refit alone is the measured decay driver, so it stays minor)
    temperature: 2.0
# BIO loss = Dice(1.5) + class-weighted cross-entropy. Dice is BINARY signing-vs-not, so it carries the O/I
# imbalance but gives NO B-vs-I signal; with B at 0.8% of frames, unweighted CE collapsed the class outright
# (measured: zero B predictions on dev, max P(B) 0.20, mean P(B) 0.015 AT gold boundaries) — the failure
# train/losses.py predicts in its docstring. Inverse frequency is far too hot on B and over-segments; `balanced`
# uses the inverse-sqrt compromise, MEASURED on the corpus being trained (train.losses.resolve_bio_class_weights)
# instead of pinning one dataset's constants — B's share is set by that corpus's sentence rate, so no fixed
# vector ports. The resolved 4-list is logged and saved with the run; an explicit {O,B,I} dict overrides it.
bio_class_weights: balanced
dice_loss_weight: 1.5 # weight on the Dice term in the in-model BIO head's NLL+Dice loss (S1 inherits this)
# In-model BIO head architecture. S1 (train.py --stage train-bio, bio_pretrain.yaml `extends` THIS file) and
# SLT training and S1 BOTH read these keys and MUST build the identical shape, or checkpoint.bio_head_init fails to
# strict-load. Keep them here as the single source of truth; do not override in bio_pretrain.yaml.
#   conv_stem_layers: the standalone Moryossef segmenter keeps the full UNet; this UNet-less head reads
#   pose-token features directly, so a small Conv1d stem restores the local boundary inductive bias
#   (EXPERIMENTS.md findings 8/23) the commit gate's δ_enc stability and RQ2 tIoU depend on. 0 = ablation (§4.4).
bio_hidden_dim: 384
bio_depth: 4
bio_nhead: 8
bio_dropout: 0.1
bio_conv_stem_layers: 2
jitter:
    # MAIN RECIPE: designed corruption for BOTH stages. `source: null` draws boundary jitter from fallback_laplace
    # and Mode-2 cut depths uniformly from fallback_cut_range — the same distributions S1 pretrains under. Designed,
    # not measured, deliberately: (a) S1↔S2 parity — swapping the nuisance model between stages injects a shift
    # justified only by fidelity to a segmenter we do not deploy; (b) deployment windows are cut by OUR head under
    # the tuned semi-Markov decode and the terminator−δ commit — a different error law from the analysis
    # segmenter's whole-video argmax errors, so a measured Laplace is not "matched to deployment" either;
    # (c) robustness training wants coverage: the designed scales sit deliberately above measured boundary offsets,
    # and sensitivity is MEASURED by the RQ1 sweep, not assumed from a proxy. The segmenter-error taxonomy stays in
    # the paper as evidence that real segmenters produce exactly these event types, inside the designed support.
    # MEASURED ABLATION: point `source` at the INDEPENDENT segmenter's artifact (never an `_s1_` file —
    # self-calibration): outputs/a_jitter_moryossef_${language}_dev.json. Laplace is the right family either way:
    # measured offsets are leptokurtic (Laplace beats Gaussian in held-out log-lik on both edges).
    source: null
    fallback_laplace:
        head_loc_s: 0.0
        head_scale_s: 0.6 # deliberately broader than measured head offsets (coverage, not point-matching)
        tail_loc_s: 0.0
        tail_scale_s: 0.8 # broader still: deployment tails also carry cap-forced commits and survival splits
    fallback_cut_range: [0.15, 0.85] # uniform relative Mode-2 cut, clipped off the edges so mode2 stays distinct from mode1/4
mixed_precision: auto # bf16 on Ampere+ GPUs, fp16+GradScaler otherwise, fp32 on CPU
batch_size: 16
num_workers:
    4 # DataLoader workers (throughput knob; parallel pose-load + window-sample + tokenize). Safe at any value:
    # exact per-epoch coverage comes from the INDEX-driven anchor (sampler.sample(index) -> anchors[index % N], and
    # DataLoader partitions indices across workers); WindowSampler.configure_worker only RESEEDS each worker's rng so
    # the per-window jitter/mode draws decorrelate. (configure_worker does NOT partition anchors — the index does.)
# Uni-Sign initialization is already converged — its own 3e-4 is for fine-tuning from its stage-2 PRETRAIN checkpoint, 
# and the closest analog to our setting (DMax adding OPUT to a converged model) uses 2e-6.
learning_rate: 1.0e-4
weight_decay: 1.0e-4
epochs: 50
eval_every_epochs: 1
early_stopping: # Opt-in TERMINATION only (best-checkpoint monitor lives in `checkpoint:`). Remove this block or set
    enabled: true # enabled: false to train the full `epochs`.
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    warmup_epochs: 0
max_grad_norm: 1.0
# Text canvas ceiling. Measured caption lengths: asf max 62, bfi max 96 tokens (mean ~15), so 128 truncates
# nothing and 96 is the lossless floor. The canvas width drives EVERY decoder forward, so most of the compute
# under a fixed 128 is spent on padding — see pad_text_to_max_length.
max_text_tokens: 128
# false = size the text canvas to the batch (block-aligned, with the EOS-supervision tail preserved). Equivalent
# supervision at ~1/3 the canvas width; tests/test_collator_dynamic_padding.py pins the equivalence. false is the
# DEPLOYED setting; true restores the fixed 128-wide canvas for an equivalence check (cb_active_count / cb_loss
# should match over the first epoch).
pad_text_to_max_length: false
validation:
    max_translation_samples: 0 # 0 = score translation on ALL dev windows
    # No separate validation diffusion_steps: dev decoding uses the single top-level `diffusion_steps`
    # below (one key for all components — train CB decode, dev eval, and inference all read it).
block_size: 4
# diffusion_steps is NOT a fixed denoising-step count: DCD/DMax terminate dynamically (commit until no mask
# remains, then settle until convergence). infer/decode.py runs the COMMIT phase to completion regardless of
# this value; diffusion_steps bounds only the DMax convergence-settle phase (Breakflag at 0.9 / no-change),
# which normally finishes in 1-3 passes. Kept generous purely as a settle safety cap.
diffusion_steps: 128
dcd:
    window_type: sliding
    # DCD within-decode commit threshold. DCD's released runs (decode_algorithm.py DecodeConfig + run_all.sh)
    # use decode_param=0.9 with the `threshold` selector everywhere; we match it. (DMax-SPD's 0.3-0.5 goes with
    # the longest-confident-prefix selector = decode_algo: dmax_prefix, so only use ~0.5 if you switch to that.)
    # decode_param is the operative selector threshold; tau_dec is its fallback — keep them equal.
    tau_dec: 0.9
    initial_window_length: 8
    max_window_length: 64
    temperature: 0.0
    top_k:
    top_p:
    decode_algo: threshold # DCD: threshold/fixed. DMax-only selector ablation: dmax_prefix.
    decode_param: 0.9
    cache_type: none # none is exact; prefix is implemented only when window_type: static.
    # NOTE: the DCD window is automatically clipped to the BD3LM attention block (DCD decode_algorithm.py::window_causal_decode
    # semantics for block-causal models). DCD's optional Dynamic Block Extension is not enabled here as this mBART-BD3LM substrate
    # is trained with fixed block_size.
spd:
    top_k: 1 # DMax SPD top-k token/mask embedding mixture.
    renormalize: true # DMax Eq. 10 norm restoration.
    # DMax self-revision (decode_uniform update_mask): committed tokens inside the
    # current DCD window are refreshed with each step's prediction — the recovery
    # behaviour OPUT's L_pred trains. false = commit-only ablation (pure DCD).
    revision: true
# NB: cross-stride inference caching is intentionally NOT implemented (forbidden by spec — the buffer is
# re-decoded from scratch each stride; see infer/stream.py). Any in-decode caching is controlled by dcd.cache_type.
