stride_s: 1.0
# The in-system S1/joint head uses one duration-aware BIO model for Viterbi and first-span marginals.
# Measured on the TRAIN split by `analyze.py --stage buffer-cap --split train --write-config` (p99 train sentence
# duration + stride_s + δ/fps, reliable sentences only; run after delta-enc). Label-only constants are measured on
# train, model-dependent constants are selected on dev. That stage is the only writer of these rows.
buffer_cap_s:
    ase: 34.92
    asf: 38.63
    bfi: 40.0
# Shared hard/soft duration scores. tune-decode writes each complete per-language model.
# Untuned languages stay absent; joint training refuses to borrow another language's settings.
duration_model:
    moryossef:
        ase: {"mu_log_s": 1.6394003173236087, "sd_log_s": 0.8218970414678328, "tail_start_s": 33.5, "completion_bias": 2.0, "boundary_logit_weight": 2.0, "annotation_signature": "caption_units:0ce47374975c962ff9a71f401faa6eeab821afbec540f33e492d39fb55a49fba"}
        bfi: {"mu_log_s": 1.6597917642153683, "sd_log_s": 0.824794324921, "tail_start_s": 38.28483999999997, "completion_bias": 1.0, "boundary_logit_weight": 2.0, "annotation_signature": "caption_units:5b20cd630e845834ef7fb315b8d7f79a949d077a59663fb973d6a388c580a32b"}
        asf: {"mu_log_s": 1.92113510819858, "sd_log_s": 0.7520746030001573, "tail_start_s": 37.16815999999996, "completion_bias": 1.0, "boundary_logit_weight": 2.0, "annotation_signature": "caption_units:95439874b5e5e061fcd578f265b3e4d4b4f878b8b0594a9dfa507392893ae435"}
    s1:
        ase: {"mu_log_s": 1.6394003173236085, "sd_log_s": 0.8218970414678328, "tail_start_s": 33.5, "completion_bias": 4.0, "boundary_logit_weight": 1.0, "annotation_signature": "caption_units:0ce47374975c962ff9a71f401faa6eeab821afbec540f33e492d39fb55a49fba"}
        bfi: {"mu_log_s": 1.6597917642153683, "sd_log_s": 0.824794324921, "tail_start_s": 38.28483999999997, "completion_bias": 5.0, "boundary_logit_weight": 1.5, "annotation_signature": "caption_units:5b20cd630e845834ef7fb315b8d7f79a949d077a59663fb973d6a388c580a32b"}
        asf: {"mu_log_s": 1.92113510819858, "sd_log_s": 0.7520746030001573, "tail_start_s": 37.16815999999996, "completion_bias": 5.0, "boundary_logit_weight": 1.5, "annotation_signature": "caption_units:95439874b5e5e061fcd578f265b3e4d4b4f878b8b0594a9dfa507392893ae435"}
boundary_stability:
    # delta-enc records which duration model was measured; stage 2 refuses a stale tolerance.
    duration_model_signature:
        ase: "6d248010c5209c3a"
        bfi: "fbd265fb3c5df730"
        asf: "0a688da746eeaaeb"
    # delta_enc_frames (δ) plays 3 coupled roles, all tied to the BIO head's boundary-noise floor (analyze.py
    # delta-enc writes the measured value here):
    #   1. terminator-stability tolerance: commit condition 1 = the target span's terminator (first O-or-B —
    #      back-to-back sentences terminate on the next B, not on a closing O) moved ≤ δ over the last
    #      hysteresis_strides strides;
    #   2. post-commit overlap: the buffer is cut at (terminator − δ), so an estimate late by ≤ δ still leaves
    #      the next sentence's B in the buffer (the leftover tail is not re-emitted: buffer-start I does not open
    #      a span, and select_target_span skips any span terminating at or before the commit frontier χ);
    #   3. target-identity tolerance: the hysteresis history resets when the selected span's start moves > δ.
    delta_enc_frames:
        ase: 10
        asf: 11
        bfi: 38
    hysteresis_strides: 3 # K: strides the terminator must hold still (spec §7.3, k ≈ 2–3); a DESIGN constant, shared
    # Fixed lag for B terminators. O terminators need no extra lag. Selected on dev by the lag-only tune-stream stage.
    commit_lag_s:
        ase: 4.0
        asf: 3.0
        bfi: 3.0

span_selection:
    # Λ_min: shortest span the FSM may commit, in encoder frames. A LABEL-domain floor: it answers "what is the
    # shortest unit we are willing to emit", which is a property of the annotation, not of the head's boundary noise.
    # 12 frames = 0.5s at 24 fps sits below the p1 annotated unit duration of every corpus (ase 17, asf 26, bfi 22
    # frames), so no annotated unit is unreachable, and far above the 1-2 frame flicker the floor exists to reject.
    # It is NOT the re-emission guard: that is the commit-frontier filter select_target_span(skip_term_before=χ),
    # which uses the commit log instead of a worst-case length bound.
    min_span_frames: 12
# Continuation of a sentence cut by a FORCED (cap) commit: "skip" (default) never translates the left-truncated
# tail — Mode-2b training gives the decoder no translation supervision on headless fragments, so its decode is
# undefined behaviour; the sentence's visible head was already emitted flagged PARTIAL.
# "translate_partial" emits the tail's decode flagged PARTIAL once its terminator appears (best-effort recovery,
# out-of-training-distribution; ablation only).
forced_tail_policy: skip
translation:
    # MEAN per-token confidence floor for the streaming commit gate (infer/commit_gate.CommitGate) — RQ2 only;
    # unused by RQ1 / --method baseline. CALIBRATE THIS to your deployed model: run the clean point
    # (`--rq 1 --method dlm --severity-grid-s 0.0`) and read mean_translation_confidence, then set τ a touch below
    # your model's clean mean so clean sentences commit and genuinely low-confidence decodes defer. It is NOT a
    # dev-tuned quality knob and it does NOT catch confidently-wrong truncations (Ω does). An all-token floor is
    # far too high for a mean under label smoothing; 0.3 is a permissive placeholder that won't zero streaming 
    # recall — tighten it once you've measured your model.
    commit_confidence_tau: 0.3
    # window = decode under the full buffer's encoder features (matches training: Mode 1/3 condition on the
    # whole jittered window and learn to disregard right-context, §5.1/§5.3). span = crop conditioning to the
    # predicted BIO span (spec §7.1 pseudocode `enc[span]`) — a conditioning shape training never produces
    # except at the zero-jitter corner; kept as an ablation.
    decode_conditioning: window
    # Decode canvas. Keep at or above the training ceiling (configs/dlm.yaml max_text_tokens): a caption unit can hold
    # several sentences, so a shorter decode canvas would truncate exactly the long units the arm was trained to emit.
    # The block decode walks blocks until every row has emitted EOS, so an unreached slot costs nothing.
    max_text_tokens: 320
    # Block-decode commit threshold (configs/dlm.yaml spd.tau_dec explains the dial and the reachable range under
    # label smoothing). Overrides dlm.yaml as read at eval time; the value stamped in the checkpoint is not consulted.
    tau_dec: 0.5
