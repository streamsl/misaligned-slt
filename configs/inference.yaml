# Streaming FSM constants, all in seconds. Code converts each to frames with the stream's own fps 
# (utils.seconds_to_frames), so a corpus at another frame rate keeps the same times.
# The duration prior of the semi-Markov decoder is NOT here: it is fitted on the target language's TRAIN unit
# durations wherever it is needed (infer.duration_decode.DurationModel.fit), with no dev-tuned weight.
stride_s: 1.0
# Latency/capacity bound: at this buffer length a complete span is force-committed (flagged PARTIAL). 40 s covers the 
# train p99 unit duration in current corpora and equals S1 maximum training context (bio_pretrain.yaml), which train-bio 
# refuses to set below this value. Every translation recipe (clean floor, arms) clamps its windows here.
# A hysteresis commit needs δ of lead-in (buffer starts at previous terminator − δ, or δ before a span that the cap kept) 
# + (K-1)·stride after terminator (plus up to 1 stride of quantization), so unit longer than about 40 - 0.5 - 2 = 37.5 s 
# commits only via forced path. An open span gets no event (P1 at inference): the cap keeps one that starts more than δ 
# after the buffer start (the next buffer starts δ before it), so a pause or a leftover before a unit does not use its 
# cap space, and drops any other, which runs about 40 - 0.5 = 39.5 s or longer with no decoded boundary (segmenter merges 
# cause most of these). The rest of a dropped span starts the next buffer as an I-run, which never opens: Mode-2b training 
# gives the decoder no translation supervision on headless fragments.
buffer_cap_s: 40.0
boundary_stability:
    # delta_s (δ) plays 3 coupled roles:
    #   1. terminator-stability tolerance: the commit condition = the target span's terminator (first O-or-B —
    #      back-to-back sentences terminate on the next B, not on a closing O) moved ≤ δ over the last
    #      hysteresis_strides strides;
    #   2. post-commit overlap: the buffer is cut at (terminator − δ); the δ frames are left context only (they are
    #      committed, so the decode tags them UNK and nothing in them is emitted again); after a real terminator the
    #      next sentence opens at the commit frontier χ (known start);
    #   3. span-identity tolerance: each candidate span keeps its own hysteresis history (infer/commit_gate.CommitGate);
    #      a start that moves > δ is another span with its own history.
    delta_s: 0.5 # 12 frames at 24 fps, 13 at 25 fps, 15 at 30 fps
    # K: strides a terminator must hold still before it commits — the ONE right-context requirement, for O and B
    # terminators alike (spec §7.3, k ≈ 2–3). The sampler's context band (dlm.yaml jitter.context_s = (K+1)·stride)
    # covers this decision horizon.
    hysteresis_strides: 3

span_selection:
    # Λ_min: the shortest span the FSM may commit. A LABEL-domain floor: it answers "what is the shortest unit we are 
    # willing to emit", which is a property of the annotation, not of the head's boundary noise. 0.5s rejects brief 
    # flicker. Any genuine unit below this floor cannot be emitted exactly; report its count and the resulting recall 
    # ceiling. A low duration percentile is not a minimum. It is NOT the re-emission guard: that is committed prefix,
    # which the decode tags UNK (infer/commit_gate.candidate_spans), not a worst-case length bound.
    min_span_s: 0.5
translation: # Decode reads support of Ω (hard crop of committed span) as a crop of buffer, the read stage 2 trains
    # Decode canvas. Keep at or above the training ceiling (configs/dlm.yaml max_text_tokens): a caption unit can hold
    # several sentences, so a shorter decode canvas would truncate exactly the long units the arm was trained to emit.
    # The block decode walks blocks until every row has emitted EOS, so an unreached slot costs nothing.
    max_text_tokens: 400
