# Faithful Moryossef 2026 external segmenter for the RQ2 cascade. It is not the in-system FSM head (that is train-bio / 
# bio_pretrain.yaml), and is NOT reusable as one: it reads the RELEASED model's own input contract — their 50 landmarks 
# (8 body + two hands, no face), their shoulder-and-standardise normalisation, velocity after — where the in-system head 
# reads Uni-Sign features. The two arms share no input representation, which keeps cascade baseline independent of the 
# method (docs/membership_gate.md §4, shared components table). Everything else is S1's: pool, chunk tiling, augmentation, 
# labels, dev monitor and best-epoch floor (moryossef26/trainer.py builds data/chunks.py ChunkDataset with `release`).
seed: 42
language: asf # default YouTube-SL-25 language; --language overrides it.
checkpoint:
    # ${corpus} = pool key (multi_<pool>) when pretrain_languages is set, else the language — same
    # rule as bio_pretrain.yaml, so both segmentation arms name checkpoints by what trained them.
    dir: checkpoints/moryossef/${corpus}
    save_best: true
    monitor: val_phrase_tiou_f1  # complete-span F1@0.5 over fixed dev chunks, S1's monitor (train.helpers.evaluate_bio_chunks)
    mode: max
    restore_best: true
    from_pretrained: checkpoints/moryossef26.safetensors
wandb:
    enabled: false
    project: misaligned-slt
    name: segmenter_${corpus}
    mode: online

# MoryossefSegmenter arch (moryossef26/model.py) — the faithful 2026 release: UNet CNN → RoPE Transformer → phrase
# BIO head, ~5.5M params. Trained END-TO-END on raw keypoints (no frozen backbone).
pose_joints: 50 # THEIR layout: 8 body + two 21-point hands, no face (moryossef26.dataset.RELEASE_KP_IDX)
velocity: true # Moryossef 2026 default: append fps-normalized per-keypoint velocity (pose_dim 3 -> 6)
hidden_dim: 384
encoder_depth: 4
attn_nhead: 8
attn_ff_mult: 2
attn_dropout: 0.1

# BIO loss = Dice(1.5) + class-weighted cross-entropy. Moryossef's own ablations run THIS UNet-CNN unweighted: it 
# detects B natively via its skip connections (Moryossef 2026 release, dist/2026/EXPERIMENTS.md, finding 8), and
# class-weighting it over-segments and collapses tIoU-F1. That evidence is measured WITH the joint sign head, which
# this corpus cannot supply, and on YouTube-SL-25, the unweighted CNN never predicts B. `balanced` (corpus-measured,
# same rule S1 uses) keeps baseline matched to the method instead of comparing against a collapsed head; `null` is 
# the faithful unweighted variant.
dice_loss_weight: 1.5
bio_class_weights: balanced

# Chunk training: each epoch tiles every record from a random phase with chunks of (num_frames - 1) / 24 s, 
# so a chunk loads at most num_frames frames (data/chunks.py; S1 tiles the same way with U(L_min, C) lengths).
num_frames: 1024 # chunk length in frames; also the RoPE window for overlap-stitched whole-video inference
batch_size: 32
grad_accum_steps: 1  # Effective batch = batch_size * grad_accum_steps, at batch_size activation memory
augmentation:        # TRAIN chunks only; same block as bio_pretrain.yaml (poses/augmentation.py has the recipe).
    fps: { min_fps: 15.0, max_fps: 30.0 }
    frame_dropout: 0.15
    body_part_dropout: 0.1

learning_rate: 2.0e-4
weight_decay: 1.0e-4
epochs: 100
eval_every_epochs: 1
early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    warmup_epochs: 4
mixed_precision: auto
max_grad_norm: 1.0

# Matched to configs/bio_pretrain.yaml: the baseline segmenter trains on the SAME language pool as S1, so the RQ2
# cascade rows compare methods rather than the amount of segmentation data each arm saw. Set both to null together
# for the monolingual recipe.
pretrain_languages: [ase, asf, bfi]
# Same pool rule as bio_pretrain.yaml: τ sets each language's share in records (clean segments), τ=1 proportional,
# τ=0 uniform; the best-epoch floor (one full rotation) is computed and printed at run time.
pretrain_temperature: 0.0
