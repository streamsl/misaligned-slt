# Faithful Moryossef 2026 external segmenter for error calibration and the RQ2 cascade. It is not the in-system FSM
# head (that is train-bio / bio_pretrain.yaml), and is NOT reusable as one: it reads the RELEASED model's own input
# contract — their 50 landmarks (8 body + two hands, no face), their shoulder-and-standardise normalisation, velocity
# after — where the in-system head reads Uni-Sign features. The two arms therefore share no preprocessing at all,
# which is what keeps calibration independent (docs/membership_gate.md §4, shared components table).
seed: 42
language: asf # default YouTube-SL-25 language; --language overrides it.
checkpoint:
    # ${corpus} = pool key (multi_<pool>) when pretrain_languages is set, else the language — same
    # rule as bio_pretrain.yaml, so both segmentation arms name checkpoints by what trained them.
    dir: checkpoints/moryossef/${corpus}
    save_best: true
    # 1-to-1 tIoU-matched segment F1 (metrics.segmentation_prf — the metric RQ2 uses): collapse-resistant
    # (neither all-I nor over-segmentation games it). On clean gap-separated streams a good detector is near-ceiling.
    monitor: val_phrase_tiou_f1
    mode: max
    restore_best: true
    from_pretrained: checkpoints/moryossef26.safetensors
wandb:
    enabled: false
    project: misaligned-slt
    name: segmenter_${corpus}
    mode: online

# MoryossefSegmenter arch (moryossef26/model.py) — the faithful 2026 release: UNet CNN → RoPE Transformer → phrase
# BIO head, ~5.5M params. Trained END-TO-END on raw keypoints (no frozen backbone).
pose_joints: 50 # THEIR layout: 8 body + two 21-point hands, no face (moryossef26.dataset.RELEASE_KP_IDX)
velocity: true # Moryossef 2026 default: append fps-normalized per-keypoint velocity (pose_dim 3 -> 6)
hidden_dim: 384
encoder_depth: 4
attn_nhead: 8
attn_ff_mult: 2
attn_dropout: 0.1

# BIO loss = Dice(1.5) + PLAIN cross-entropy. bio_class_weights null (UNWEIGHTED) is deliberate for THIS UNet-CNN:
# Moryossef's own ablations show the CNN detects B natively via its skip connections (EXPERIMENTS.md finding 8) and
# class-weighting it over-segments and collapses tIoU-F1 (findings 7/17/25; E11 unweighted Phrase IoU 0.90 vs E5
# light-B=2 IoU 0.64). The ~35x B-weight recipe is the ORIGINAL paper's BiLSTM recipe, not the CNN one.
#   FALLBACK: if THIS UNet-CNN actually collapses to all-I on dev (val_bio_recall=1.0, zero predicted segments),
#   try {O:1, B:2, I:1} and compare val_phrase_tiou_f1 — an EXPLICIT ablation, not the default.
dice_loss_weight: 1.5
# The FALLBACK above has FIRED: on YouTube-SL-25 this CNN never predicts B. The unweighted evidence cited above
# was measured WITH the joint sign head, which this corpus cannot supply, so it does not transfer. `balanced`
# (corpus-measured, same rule S1 uses) keeps the baseline matched to the method instead of comparing against a
# collapsed head; `null` reproduces the faithful-but-collapsed variant.
bio_class_weights: balanced

# Whole-video chunk training (Moryossef-style; distinct from the SLT window sampler).
num_frames: 1024 # chunk length in frames; also the RoPE chunk size for chunked inference
steps_per_epoch: null # null = cover the corpus once/epoch (sum of video frames / num_frames)
batch_size: 32
grad_accum_steps: 1     # Effective batch = batch_size * grad_accum_steps, at batch_size activation memory
augmentation:
    # fps_aug ONLY (Moryossef 2026: essential; speed_aug hurts). Downsample-only, so the range must dip 
    # below the source rate to do anything. YouTube-SL-25 poses are 24 fps.
    fps: { enabled: true, min_fps: 15.0, max_fps: 30.0 }
    frame_dropout: 0.15 # Moryossef repo default: drop 0-15% middle frames during train.
    body_part_dropout: 0.1 # Moryossef repo default: zero each hand independently during train.

learning_rate: 2.0e-4
weight_decay: 1.0e-4
epochs: 100
eval_every_epochs: 1
early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    warmup_epochs: 4
mixed_precision: auto
max_grad_norm: 1.0
# The pred→GT match bar is an analysis knob (`analyze.SEGMENTER_ERROR_MATCH_TIOU = 0.1`,
# override with `analyze.py --tiou-threshold`), not a segmenter-training param.

# Matched to configs/bio_pretrain.yaml: the baseline segmenter trains on the SAME language pool as S1, so the RQ2
# cascade rows compare methods rather than the amount of segmentation data each arm saw. Set both to null together
# for the monolingual recipe.
pretrain_languages: [ase, asf, bfi]
pretrain_temperature: 0.3
