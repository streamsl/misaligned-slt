seed: 42
language: asf
checkpoint:
  dir: checkpoints/segmenter/asf   # best model.pt + best.json saved here
  save_best: true                  # write on every new best monitored value (val_phrase_tiou_f1)
wandb:
  enabled: true
  project: misaligned-slt
  name: segmenter_asf
  mode: online
mixed_precision: auto   # bf16 on Ampere+ GPUs, fp16+GradScaler otherwise, fp32 on CPU
batch_size: 128
num_frames: 1024
velocity: true          # Moryossef 2026 repo default: append fps-normalized velocity.
hidden_dim: 384
encoder_depth: 4
attn_nhead: 8
attn_ff_mult: 2
attn_dropout: 0.1
dice_loss_weight: 1.5  # Moryossef 2026 README: Dice weight 1.5 helped.
# Phrase BIO only: YouTube-SL-25 captions give no sign/gloss spans, so the sign head that gave
# Moryossef dense B supervision is dropped. Measured Auslan frame balance (corrected per-video
# fps timeline): B=1.1%, O=11%, I=83%, UNK=4%.
# Unweighted CE + binary Dice (no B-vs-I signal) collapses to predicting all-I (val_bio_recall=1.0,
# zero predicted segments at inference). Upweight the rare boundary/gap classes. Set to null to
# recover Moryossef's exact unweighted recipe. Tune B up if under-segmenting, down if spurious cuts.
# O stays 1.0: ~42% of uncaptioned time is long intro/outro stretches whose signing status is
# unknown (now UNK-masked via trusted_gap_s, see data/windowing.py) — upweighting O amplified that
# mislabeled supervision and pushed the model toward an all-O collapse. B keeps the split signal.
bio_class_weights:
  O: 1.0
  B: 8.0
  I: 1.0
# Items per training epoch. null = cover the corpus once (sum of video frames / num_frames ≈ 2.9k
# chunks ≈ 23 optimizer steps at batch 128). The old default was one chunk per video (867 → 7
# steps/epoch at batch 128), which made epoch-based early stopping kill runs after ~150 total
# steps — the model never trained. Raise for more optimization per epoch.
steps_per_epoch: null
fps_aug:
  enabled: true
  # Moryossef trains at random 25–50 fps because HIS data is 25–60 fps. Our poses are effectively
  # 12.0–15.0 fps (extracted at native/2; per-video fps from video_meta.json) and
  # apply_fps_aug only DOWNSAMPLES, so the range must dip BELOW the source rate to do anything:
  # [6.25, 25] draws real 0.5–1.0x density variation for ~12.5 fps sources (RoPE keeps true
  # seconds, so boundaries stay put) — the robustness the original ablation calls essential.
  # max_fps stays ABOVE the sources on purpose: a draw >= source fps is a no-op = training at
  # native density, which eval always runs at. Capping at 12.5 would deny the ~30% of videos at
  # 15 fps (30fps native) and the full-rate 25s their native density in training.
  min_fps: 6.25
  max_fps: 25.0
frame_dropout: 0.15    # Public repo default: drop 0-15% middle frames during train.
body_part_dropout: 0.1 # Public repo default: zero each hand independently during train.
speed_aug:
  enabled: false        # Moryossef 2026 README: speed augmentation hurts.
attention_padding_mask:
  enabled: false        # Moryossef 2026 README: padding attention mask hurt.
optimizer:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  epochs: 500
eval_every_epochs: 1
early_stopping:
  # One-to-one tIoU-matched segment F1 (metrics._segment_tiou_f1): count-sensitive, so neither the
  # all-I collapse (1 giant run → high frame-IoU) nor over-segmentation can game it. Moryossef's
  # frame-IoU (val_phrase_seg_iou) is still logged for comparison with his published numbers.
  # CEILING on this data (measured at the corrected per-video-fps timeline): a PERFECT ≥0.3s-pause
  # detector scores tiou_f1@0.5 ≈ 0.31 (gold 33.3 segs/video, 68% of caption boundaries are
  # back-to-back → under-segmentation is unavoidable; those merges are exactly the Mode-3 events
  # the thesis studies). Plateauing around 0.20–0.31 is SUCCESS, with frame seg_iou expected at
  # 0.7–0.9 — not Moryossef's 0.91 (his DGS phrase annotations are visual; ours are caption timings).
  monitor: val_phrase_tiou_f1
  mode: max
  patience: 100
  min_delta: 0.0
  restore_best: true
scheduler:
  type: onecycle        # Moryossef 2026 repo default optimizer is adamw-onecycle.
  max_lr: 1.0e-3
  pct_start: 0.1
  div_factor: 25.0
  final_div_factor: 10000.0
# Analysis A pred->GT matching bar (spec §8.1 Step 3): deliberately LOW so near-misses count as
# matched pairs (their boundary error feeds the (Δ_head, Δ_tail) CDF) instead of inflating
# skipped/phantom rates. A high bar (e.g. 0.9) would bias the jitter CDF toward near-zero offsets
# and miscalibrate the §5.5 mode ratios.
match_tiou_threshold: 0.1
