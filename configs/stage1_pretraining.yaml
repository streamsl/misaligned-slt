# Pretraining source of truth — the pose encoder + language model that every later stage (baseline eval,
# stage2_ar, stage2_dlm) rebuilds from. The pose encoder is the Uni-Sign 69-kp 4-part ST-GCN (the only backbone);
# the LANGUAGE MODEL is selected by language_model.name: mT5 (default, has released Uni-Sign weights) or mBART
# (the mT5-vs-mBART ablation — same pose encoder + prompt, only the LM differs). No stage-1 training and no
# vocabulary trim: weights come from the released checkpoint (mBART LM starts from base).
seed: 42
language: csl
visual_padding: none # raw windows (the LM encoder masks padding via attention_mask; no boundary halos)
mixed_precision: auto # bf16 on Ampere+ GPUs, fp16+GradScaler otherwise, fp32 on CPU
wandb:
    enabled: true
    project: misaligned-slt
    name: stage1_pretraining_${language}
    mode: online
language_model:
    # mT5 (default; the released Uni-Sign weights load on top) | mBART ablation: facebook/mbart-large-cc25
    name: google/mt5-base
checkpoint:
    # Released Uni-Sign pose-only SLT weights. The baseline loads this for eval; stage2_ar / stage2_dlm fine-tune
    # from it (the mBART ablation loads the pose encoder from it; the mBART LM starts from base). --checkpoint overrides.
    from_pretrained: checkpoints/csl_daily_pose_only_slt.pth
# Pose augmentation — TRAIN ONLY (dev/eval never augmented), applied to RAW pixel keypoints before
# normalization. The `fps` sub-block is temporal (streaming windows only; ignored by stage 1 / the baseline).
# Spatial ops are length-preserving so per-frame timestamps/BIO stay aligned. Frame-referenced ops
# (affine/spatial_mask) use the per-dataset frame size (data.yaml pose.width/height); rotation is
# centroid-based and size-free.
augmentation:
    enabled: true
    rotation: { deg: 15.0, prob: 0.5 } # centroid rotation (spatial augmentation on raw keypoints)
    affine: { prob: 0.0, scale: [0.9, 1.1], shift: [-0.05, 0.05], degree: null, shear: null } # scale~RandomResize, shift~RandomTranslate
    spatial_mask: { prob: 0.0, size: [0.1, 0.2] }
batch_size: 4
# learning_rate: 5.0e-5
# weight_decay: 1.0e-4
# epochs: 100
# eval_every_epochs: 1
# early_stopping: # Early stopping is OPT-IN and only terminates training (best-checkpoint selection lives in `checkpoint:`)
#     enabled: true # Remove this block or set enabled: false to train the full `epochs` with no early stop.
#     patience: 20
#     min_delta: 0.0
# scheduler:
#     type: cosine
#     eta_min: 1.0e-6
# max_grad_norm: 1.0
freeze_backbone: false
