seed: 42
language: asf
wandb:
  enabled: true
  project: misaligned-slt
  name: stage1_vlp_asf
  mode: online
mbart:
  name: facebook/mbart-large-cc25
  trimmed_dir: checkpoints/trimmed_mbart_asf   # trim_mbart output; ONE dir holding the trimmed tokenizer + model
  # Depth-trim the vocab-trimmed mBART in the same trim-mbart step: keep the first N pretrained encoder /
  # decoder layers (truncation-init, not random) plus embeddings + layer norms; drop the deeper layers.
  # This single small model is used everywhere (stage-1 text encoder, visual encoder, AR/DLM decoder).
  # Truncation-init (vs GFSLT-VLP's random "mytran") is required because our ONE model is also the
  # stage-1 text encoder: a random text encoder gives the contrastive loss no stable target and VLP
  # diverges. Head count is left at the source's (omit attention_heads) so pretrained attention transfers
  # exactly; layer count is the only size lever at fixed d_model. Remove `layers:` to keep full depth.
  layers:
    encoder: 3
    decoder: 3
checkpoint:
  # Best VLP visual backbone (visual_backbone.pt + best.json), written the moment a new best dev value
  # is found — not only at the end. The GFSLT baseline and stage 2 load it via their checkpoint.from_vlp.
  dir: checkpoints/vlp/asf
  save_best: true
embed_dim: 1024
hidden_size: 1024
temporal_kernel: 3
use_temporal_conv: false  # Keep per-frame features aligned with the BIO/streaming contract.
visual_padding: gfslt     # GFSLT-VLP repeats boundary frames with 8-frame halos.
# GFSLT-VLP VLP = contrastive (SLRCLIP) + masked-text decoder reconstruction
# (Text_Decoder / CMLM). The CMLM half pretrains the mBART decoder reused by both
# the AR baseline (Analysis B) and our DLM; omitting it leaves the decoder at raw
# mBART init and makes the GFSLT baseline unfaithful. Ref: GFSLT-VLP train_vlp_v2.py.
cmlm:
  enabled: true
  lambda: 1.0           # args.loss_lambda in train_vlp_v2.py
  noise_rate: 0.15      # utils.NoiseInjecting default
  noise_type: omit_last # {omit_last, omit}; GFSLT default omit_last
  random_shuffle: false
  label_smoothing: 0.2  # CrossEntropyLoss(ignore_index=PAD, label_smoothing=0.2)
mixed_precision: auto   # bf16 on Ampere+ GPUs, fp16+GradScaler otherwise, fp32 on CPU
batch_size: 64
learning_rate: 5.0e-4
weight_decay: 1.0e-4
epochs: 50
eval_every_epochs: 1
early_stopping:
  # Stage-1's deliverable is the aligned pose<->text space; in-batch retrieval accuracy measures it
  # directly. val_loss mixes in the CMLM term, which overfits fastest on ~18k sentences and drags
  # the combined loss up while the contrastive alignment is still improving — early-stopping on
  # val_loss therefore stops too early. (val_loss rising after a few epochs is expected small-data
  # overfitting, not a bug; the monitor just has to watch the right signal.)
  monitor: val_image_retrieval_acc
  mode: max
  patience: 10
  min_delta: 0.0
  restore_best: true
scheduler:
  type: cosine
  eta_min: 1.0e-6
max_grad_norm: 1.0
freeze_backbone: false
