seed: 42
language: phoenix
visual_padding: none # GFSLT-VLP repeats boundary frames with 8-frame halos; none = raw windows.
mixed_precision: auto # bf16 on Ampere+ GPUs, fp16+GradScaler otherwise, fp32 on CPU
wandb:
    enabled: true
    project: misaligned-slt
    name: stage1_vlp_${language}
    mode: online
mbart:
    name: facebook/mbart-large-cc25
    trimmed_dir: checkpoints/trimmed_mbart_${language} # trim_mbart output (run with --target-lang de_DE).
    # Depth-trim the vocab-trimmed mBART in the same trim-mbart step: keep the first N pretrained encoder /
    # decoder layers (truncation-init, not random) plus embeddings + layer norms; drop the deeper layers.
    # This single small model is used everywhere (stage-1 text encoder, visual encoder, AR/DLM decoder).
    # Truncation-init (vs GFSLT-VLP's random "mytran") is required because our ONE model is also the stage-1
    # text encoder: a random text encoder gives the contrastive loss no stable target and VLP diverges.
    # Head count is left at the source's (omit attention_heads) so pretrained attention transfers exactly;
    # layer count is the only size lever at fixed d_model. Remove `layers:` to keep full depth.
    layers:
        encoder: 3
        decoder: 3
# Pose backbone — SINGLE architecture source of truth. The baseline / stage-2 / eval all rebuild their model from
# THIS block (VLP checkpoint carries these weights), so changing anything here requires re-running stage-1 VLP +
# every downstream stage. Everything pose encoder + VLP projection needs lives here, nothing scattered at top level.
backbone:
    name: cosign # cosign | dsta
    embed_dim: 1024 # VLP sign-projection / contrastive dim
    hidden_size: 1024 # pose-backbone hidden width (mBART d_model)
    # Scale post-VLP pose features by sqrt(d_model) before the mBART encoder, matching GFSLT-VLP's
    # gloss_free_model.embed_scale (models.py:307). HF MBartEncoder does NOT scale `inputs_embeds`, so with
    # false the pretrained encoder receives pose features at positional-embedding magnitude. A/B candidate.
    scale_embedding: false
    use_temporal_conv: false # legacy GFSLT temporal downsampler; keep false for the frame-aligned BIO contract.
    # EXPERIMENT: skip the mBART TEXT encoder in the pose path. true = the decoder cross-attends to the per-frame
    # VLP features directly (decoder-only-captioner style, like the prior project's stronger-pose-BLEU design);
    # VLP stage-1 then aligns the projection (masked mean-pool), not a pose-digesting encoder. Inherited by
    # baseline/stage-2/eval, so a fair A/B needs a fresh VLP run with the same value. (NOT encoder_layers=0.)
    bypass_mbart_encoder: false
    cosign: # CoSign1s ST-GCN on 77 group-normalised keypoints (the default). Resolution-independent group norm.
        num_keypoints: 77
        temporal_kernel: 3
    # MSKA's 4-stream decoupled spatial-temporal attention on 133 MSKA-normalised COCO-WholeBody keypoints
    # (a stronger keypoint encoder, gloss-free here). Used only when name: dsta — auto-switches the data
    # layer to the mska133 representation (poses.pose_repr_for_backbone).
    dsta:
        # Spatial positional-encoding buffers are sized to this many frames; must exceed the longest window
        # the backbone sees (streaming buffer_cap_s * fps). 256 ~ 20s at 12.5 fps (> the 18s buffer cap).
        num_frame: 256
        dropout: 0.1
        mask_aware: true # exclude batch-padded frames from DSTA's BatchNorm statistics
checkpoint:
    # Best VLP visual backbone (visual_backbone.pt + best.json), written the moment a new best dev value is
    # found — not only at the end. The GFSLT baseline and stage 2 load it via their checkpoint.from_vlp.
    dir: checkpoints/vlp/${language}
    save_best: true
    # Best-checkpoint SELECTION metric (separate from early stopping). Stage-1's deliverable is the aligned
    # pose<->text space; in-batch retrieval accuracy measures it directly. val_loss mixes in the CMLM term,
    # which overfits fastest on ~18k sentences and drags the combined loss up while alignment still improves.
    monitor: val_image_retrieval_acc
    mode: max
    restore_best: true # restore the best-monitor weights at the end of training
# Pose augmentation — TRAIN ONLY (dev/eval never augmented), applied to RAW pixel keypoints before
# normalization. The `fps` sub-block is temporal (streaming windows only; ignored by stage 1 / the baseline).
# Spatial ops are length-preserving so per-frame timestamps/BIO stay aligned. Frame-referenced ops
# (flip/affine/spatial_mask) use the per-dataset frame size (data.yaml pose.width/height); rotation is
# centroid-based and size-free. rotation = MSKA random_move; flip+affine = GFSLT-VLP flip + RandomResizedCrop.
augmentation:
    enabled: true
    rotation: { deg: 15.0, prob: 0.5 } # MSKA default ±15°
    flip: { prob: 0.0 } # set 0.5 for GFSLT-VLP-style horizontal flip (mirrors the signer)
    affine: { prob: 0.0, scale: [0.9, 1.1], shift: [-0.05, 0.05], degree: null, shear: null } # GFSLT RandomResizedCrop analogue
    spatial_mask: { prob: 0.0, size: [0.1, 0.2] }
# GFSLT-VLP VLP = contrastive (SLRCLIP) + masked-text decoder reconstruction (Text_Decoder / CMLM). The CMLM half pretrains the
# mBART decoder reused by both the AR baseline (Analysis B) and our DLM; omitting it leaves the decoder at raw mBART init and
# makes the GFSLT baseline unfaithful. Ref: GFSLT-VLP train_vlp_v2.py.
cmlm:
    enabled: true
    lambda: 1.0 # args.loss_lambda in train_vlp_v2.py
    noise_rate: 0.15 # utils.NoiseInjecting default
    noise_type: omit_last # {omit_last, omit}; GFSLT default omit_last
    random_shuffle: false
    label_smoothing: 0.2 # CrossEntropyLoss(ignore_index=PAD, label_smoothing=0.2)
batch_size: 4
learning_rate: 5.0e-5
weight_decay: 1.0e-4
epochs: 100
eval_every_epochs: 1
early_stopping: # Early stopping is OPT-IN and only terminates training (best-checkpoint selection lives in `checkpoint:`)
    enabled: true # Remove this block or set enabled: false to train the full `epochs` with no early stop.
    patience: 20
    min_delta: 0.0
scheduler:
    type: cosine
    eta_min: 1.0e-6
max_grad_norm: 1.0
freeze_backbone: false
