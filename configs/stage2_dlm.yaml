seed: 42
language: phoenix
checkpoint:
  dir: checkpoints/stage2_dlm/phoenix   # best model.pt + best.json saved here
  from_vlp: checkpoints/vlp/phoenix     # stage-1 visual backbone to initialise from
  save_best: true                   # write on every new best dev value (not just end of training)
decoder: dlm
wandb:
  enabled: true
  project: misaligned-slt
  name: stage2_dlm_phoenix
  mode: online             # offline / disabled if no network or key
use_temporal_conv: false
visual_padding: gfslt
training_distribution: misalignment_sampler
freeze_backbone: false  # Freeze the from-scratch CoSign pose backbone in stage 2 as an overfitting regularizer.
freeze_projection: false
lambda_trans: 1.0
oput:
  # DMax dFactory data_transform.sft_noise_transition samples sigma ~ U(0.3, 0.8).
  # [0,1] wastes steps on near-trivial (t->0) and near-degenerate (t->1) masking.
  t_low: 0.3
  t_high: 0.8
  sample_t: uniform
  # DMax train_llada2_bd_oput.py corrupts on-policy with argmax (the greedy token SPD commits 
  # at temperature 0). false = argmax (faithful default); true = sampled-rollout ablation.
  sample_rollout: false
  loss_over_all_positions: true
  # DMax computes the rollout under model.eval() + no_grad (train_llada2_bd_oput.py)
  # so the corruption is drawn dropout-free — the distribution inference sees.
  # true = faithful (one extra no-grad decoder forward on Mode 1/3 batches);
  # false = reuse the dropout-noised L_mask logits (cheaper approximation).
  rollout_eval_mode: true
  # Supervise the first K canvas slots after [.., eos, lang] with EOS targets.
  # dLLM AppendEOSBlockWrapper pads labels to the block boundary with eos;
  # DMax data_transform keeps loss on the first 32 trailing eos. Without this the
  # post-sentence canvas is never trained and decodes to confident garbage before
  # EOS commits (hallucinated tails; corrupted commit-gate confidence). 0 disables.
  eos_supervision_tokens: 32
confidence_bound:
  # Right-truncated (Mode 2a) term. The full-evidence decode is a no-grad
  # stop-grad self-target; the gate reads the real SPD+DCD decode's confidence;
  # the CE gradient flows through ONE cheap forward on the decoded sequence with
  # the gated slots re-masked (the DCD deferral counterfactual), not the
  # ~64-step decode. See models/streaming_slt.py + dlm_decoder.remasked_logits.
  enabled: true
  verified_full_evidence_gate: true   # penalize only where full-evidence decode == reference
  tau_cb: 0.75
  lambda: 0.3            # λ_cb; prior de-risk found ~0.3 stable
  warmup_epochs: 3       # hold CB off until the full-evidence self-target is trustworthy
  allow_disable_for_ablation: true
mode_ratios:
  source: outputs/a_mode_ratios_phoenix.json
  # Designed misalignment distribution used directly when no measured file exists AND auto-substituted
  # when the measured Analysis-A ratios are DEGENERATE (mode1 >= degenerate_mode1_threshold) — i.e. the
  # segmenter is too clean (PHOENIX) to produce real misalignment. Without this the sampler would train
  # ~98% Mode-1 (no robustness). Robustness is still evaluated by the segmenter-agnostic RQ1 sweep.
  degenerate_mode1_threshold: 0.9
  fallback:
    mode1: 0.55
    mode2: 0.20
    mode3: 0.20
    mode4: 0.05
# Within Mode 2, each over-segmentation event yields one right-trunc + one left-trunc window, so right~=left dominate; 
# both-truncated is rare and "falls out of the sampler naturally". Uniform 1/3 over-represents the no-translation-supervision 
# "both" case and dilutes the linchpin Mode-2a signal.
mode2_subcase_weights:
  right: 0.45
  left: 0.45
  both: 0.10
# Moryossef 2026: fps_aug essential (0.58→0.49 without), speed_aug forbidden. Applied to sampled training windows (BIO
# labels rebuilt from resampled timestamps); the Mode-2a full-evidence view stays native-fps. The synthetic streams run at
# an exact 12.5 fps (manifest.target_fps; the legacy YouTube path is per-video ~12–15 fps from video_meta.csv) and
# apply_fps_aug only downsamples — the range must dip below the source rate: [6.25, 25] gives real 0.5–1.0x density
# variation (RoPE keeps true seconds). max_fps stays above the source on purpose: draws >= source fps are no-ops =
# native-density training, which eval always runs at.
fps_aug:
  enabled: true
  min_fps: 6.25
  max_fps: 25.0
# Rare-class CE weighting for the in-model BIO head, which faces a heavy I-dominant imbalance (PHOENIX streams: B≈1.4% 
# of frames, signing density ~0.71; binary Dice has no B-vs-I gradient) and would otherwise collapse toward all-I. Unlike 
# the standalone UNet segmenter (bio_class_weights: null — its skip connections detect B natively and weighting makes that 
# arch over-segment), this UNet-less transformer head keeps a light B:2. null = unweighted.
bio_class_weights:
  O: 1.0   # not upweighted: long uncaptioned stretches are UNK-masked, residual O labels stay noisy
  B: 2.0
  I: 1.0
# In-model BIO head temporal Conv1d stem depth (models/bio_head.py TemporalConvStem). The standalone
# segmenter keeps the full Moryossef UNet; this head reads post-VLP features directly with no UNet, so
# a small conv stem restores the local boundary inductive bias (EXPERIMENTS.md findings 8/23) that the
# commit gate's δ_enc stability and RQ2 tIoU depend on. 0 = ablation (pure transformer, spec §4.4).
bio_conv_stem_layers: 2
jitter:
  source: outputs/a_jitter_phoenix.json
  fallback_laplace:
    head_loc_s: 0.0
    head_scale_s: 0.6
    tail_loc_s: 0.0
    tail_scale_s: 0.8
mixed_precision: auto   # bf16 on Ampere+ GPUs, fp16+GradScaler otherwise, fp32 on CPU
batch_size: 16
learning_rate: 2.0e-4
weight_decay: 1.0e-4
epochs: 100
eval_every_epochs: 1
early_stopping:
  # Select on dev BLEU, not val_loss. The composite val_loss (BIO + OPUT + CB) rises from translation-side
  # overfitting on the small corpus while BLEU is still climbing, so a min-val_loss monitor restores an
  # early, low-BLEU checkpoint (GFSLT-VLP likewise selects on dev BLEU, train_slt.py). Generation runs every
  # eval anyway (max_translation_samples: 0).
  monitor: val_translation_bleu4
  mode: max
  patience: 20
  min_delta: 0.0
  restore_best: true
scheduler:
  type: cosine
  eta_min: 1.0e-6
max_grad_norm: 1.0
max_text_tokens: 128
validation:
  max_translation_samples: 0   # 0 = score translation on ALL dev windows
  # No separate validation diffusion_steps: dev decoding uses the single top-level `diffusion_steps`
  # below (one key for all components — train CB decode, dev eval, and inference all read it).
block_size: 4
# diffusion_steps is NOT a fixed denoising-step count: DCD/DMax terminate dynamically (commit until no mask
# remains, then settle until convergence). infer/decode.py runs the COMMIT phase to completion regardless of
# this value; diffusion_steps bounds only the DMax convergence-settle phase (Breakflag at 0.9 / no-change),
# which normally finishes in 1-3 passes. Kept generous purely as a settle safety cap.
diffusion_steps: 128
dcd:
  window_type: sliding
  # DCD within-decode commit threshold. DCD's released runs (decode_algorithm.py DecodeConfig + run_all.sh)
  # use decode_param=0.9 with the `threshold` selector everywhere; we match it. (DMax-SPD's 0.3-0.5 goes with
  # the longest-confident-prefix selector = decode_algo: dmax_prefix, so only use ~0.5 if you switch to that.)
  # decode_param is the operative selector threshold; tau_dec is its fallback — keep them equal.
  tau_dec: 0.9
  initial_window_length: 8
  max_window_length: 64
  temperature: 0.0
  top_k:
  top_p:
  decode_algo: threshold    # DCD: threshold/fixed. DMax-only selector ablation: dmax_prefix.
  decode_param: 0.9
  cache_type: none          # none is exact; prefix is implemented only when window_type: static.
  refresh_count: 16
  # NOTE: the DCD window is automatically clipped to the BD3LM attention block
  # (DCD decode_algorithm.py::window_causal_decode semantics for block-causal
  # models). DCD's optional Dynamic Block Extension is not enabled here because
  # this mBART-BD3LM substrate is trained with a fixed block_size; ablate via
  # decode_spd_dcd(window_block_clip=False) only as a controlled non-faithful run.
spd:
  top_k: 1                  # DMax SPD top-k token/mask embedding mixture.
  renormalize: true         # DMax Eq. 10 norm restoration.
  # DMax self-revision (decode_uniform update_mask): committed tokens inside the
  # current DCD window are refreshed with each step's prediction — the recovery
  # behaviour OPUT's L_pred trains. false = commit-only ablation (pure DCD).
  revision: true
inference_cache:
  enabled: false            # Cross-stride cache remains forbidden.
  scope: intra_decode_only
